server.port=${SERVER_PORT:8082}
server.address=0.0.0.0

spring.config.import=optional:classpath:env.properties

# MongoDB
spring.data.mongodb.uri=mongodb+srv://${MONGO_USERNAME}:${MONGO_PASSWORD}@ems.o0yy1tu.mongodb.net/employee
spring.data.mongodb.auto-index-creation=true

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION_MS:32400000}

# Admin Account Config
admin.email=${ADMIN_EMAIL}
admin.password.hash=${ADMIN_PASSWORD_HASH}

# Mail Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
mail.store.protocol=imaps
mail.imap.host=imap.gmail.com
mail.imap.port=993

# Logging
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO

# Actuator & Monitoring Configuration
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always
management.health.mail.enabled=false

# OTA Update Storage
agent.update.storage-directory=./agent-updates
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=110MB

# Employee Attendance Policy
workday.required-hours=9
idle.grace-minutes=2