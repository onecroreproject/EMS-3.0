<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Add Organization</title>
    <!-- Bootstrap 5.3 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome 6.4 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts - Public Sans -->
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
 <style>
        body {
            font-family: "Public Sans", sans-serif;
             background-color: #f4f6f8;
            color: #212529;
        }

        .container {
            background-color: #ffffff;
            border-radius: 12px;
            padding: 2.5rem;
            margin-left: 350px;
            margin-right: auto;
            max-width: 900px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
        }

        h2 {
            color: #003366; /* strong corporate navy */
    
            margin-bottom: 2rem;
            font-weight: 600;
        }

        .form-label {
            color: #0d6efd;
            font-weight: 500;
            margin-bottom: 0.5rem;
        }

        .form-control {
            background-color: #ffffff;
            border: 1px solid #ced4da;
            color: #212529;
            padding: 0.75rem;
        }

        .form-control:focus {
            background-color: #ffffff;
            color: #212529;
            border-color: #0d6efd;
            box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.25);
        }

        .btn-primary {
            background-color: #0d6efd;
            border-color: #0d6efd;
            color: #ffffff;
            font-weight: 600;
            padding: 0.6rem 1.2rem;
        }

        .btn-primary:hover {
            background-color: #0b5ed7;
            border-color: #0a58ca;
        }

        .btn-link {
            color: #0d6efd !important;
            text-decoration: none;
            font-weight: 500;
            margin-left: 1rem;
        }

        .btn-link:hover {
            color: #0a58ca !important;
        }
    </style>
</head>

<body>

<!-- Sidebar (optional if using fragments) -->
<div th:replace="fragments/sidebar :: sidebar"></div>

<main id="mainContent" class="content-expanded p-4">
    
    <div class="container mt-4">
        <h2 th:text="${team.id == null} ? 'Create Team' : 'Edit Team'"></h2>
        <form th:action="@{/teams/save}" th:object="${team}" method="post">
       
              <div class="mb-3">
              <input type="hidden" th:field="*{id}" />

            </div>
            <div class="mb-3">
                <label class="form-label">Team Name</label>
                <input class="form-control" th:field="*{name}" required />
            </div>
            <div class="mb-4">
                <label class="form-label">Department</label>
                <select class="form-control" th:field="*{departmentId}" required>
                    <option value="">-- Select --</option>
                    <option th:each="dept : ${departments}" th:value="${dept.id}" th:text="${dept.name}"></option>
                </select>
            </div>
            <button class="btn btn-primary">Save</button>
            <a th:href="@{/teams/list}" class="btn btn-link">Cancel</a>
        </form>
   </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
      // Toggle sidebar
      document.getElementById('toggleSidebar').addEventListener('click', function () {
          document.getElementById('sidebar').classList.toggle('sidebar-collapsed');
          document.getElementById('mainContent').classList.toggle('content-expanded');
      });

      // Add active class to clicked nav items
      const navLinks = document.querySelectorAll('.nav-link');
      navLinks.forEach(link => {
          link.addEventListener('click', function () {
              navLinks.forEach(l => l.classList.remove('active'));
              this.classList.add('active');
          });
      });

      // Simulate loading animations
      document.addEventListener('DOMContentLoaded', function () {
          const animatedElements = document.querySelectorAll('.animate-fadein');
          animatedElements.forEach(el => {
              el.style.opacity = '0';
          });

          setTimeout(() => {
              animatedElements.forEach(el => {
                  el.style.opacity = '1';
              });
          }, 100);
      });


      document.addEventListener('DOMContentLoaded', function () {
          const empSelect = document.getElementById("empName");

          if (empSelect && empSelect.value) {
              fetchEmployeeDetails();
          }
      });


  </script>
</body>
</html>
