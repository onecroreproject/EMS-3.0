<header class="ems-top-header"
        th:fragment="header">

    <!-- =====================================================
         LEFT SIDE : MOBILE MENU + BRAND
         ===================================================== -->

    <div class="ems-header-left">

        <!-- Mobile Menu -->
        <button type="button"
                id="emsSidebarToggle"
                class="ems-header-menu-button"
                title="Toggle Navigation"
                aria-label="Toggle Navigation"
                aria-expanded="false">

            <i class="fas fa-bars"></i>

        </button>


        <!-- Brand -->
        <a th:href="@{/admin/home}"
           class="ems-header-brand-link">

            <!-- Logo -->
            <div class="ems-header-logo">

                <i class="fas fa-clock"></i>

            </div>


            <!-- Brand Name -->
            <div class="ems-header-brand-content">

                <div class="ems-header-brand-name">
                    EmpMonitor
                </div>

                <div class="ems-header-brand-subtitle">
                    Employee Monitoring System
                </div>

                <div class="ems-header-brand-tagline">

                    <span>Track</span>

                    <span class="ems-header-dot">·</span>

                    <span>Manage</span>

                    <span class="ems-header-dot">·</span>

                    <span>Empower</span>

                </div>

            </div>

        </a>

    </div>


    <!-- =====================================================
         CENTER : SEARCH
         ===================================================== -->

    <div class="ems-global-search">

        <i class="fas fa-search ems-search-icon"></i>

        <input
                type="search"
                id="emsGlobalSearch"
                class="ems-global-search-input"
                placeholder="Search employee, device or report..."
                autocomplete="off"
                aria-label="Global Search">

        <div id="emsSearchResults"
             class="ems-search-results">
        </div>

    </div>


    <!-- =====================================================
         RIGHT SIDE
         ===================================================== -->

    <div class="ems-header-right">


        <!-- Notification -->
        <button
                type="button"
                id="emsNotificationButton"
                class="ems-header-icon-button"
                title="Notifications"
                aria-label="Notifications">

            <i class="fas fa-bell"></i>

            <span class="ems-notification-badge">
                3
            </span>

        </button>


        <!-- Admin Profile -->
        <button
                type="button"
                id="emsAdminProfile"
                class="ems-admin-profile"
                aria-label="Admin Profile"
                aria-expanded="false">


            <!-- Avatar -->
            <span class="ems-admin-avatar">

                <i class="fas fa-user"></i>

            </span>


            <!-- Admin Details -->
            <span class="ems-admin-info">

                <span class="ems-admin-name">
                    Admin
                </span>

                <span class="ems-admin-role">
                    Administrator
                </span>

            </span>


            <!-- Dropdown -->
            <i class="fas fa-chevron-down ems-admin-chevron"></i>


        </button>

    </div>

</header>
