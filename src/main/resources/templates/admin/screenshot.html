<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Admin Dashboard | Employee Monitoring</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans&display=swap" rel="stylesheet" />

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/styles.css}" />
</head>

<body style="font-family: 'Public Sans', sans-serif; background-color: #f8f9fa;">
    <div th:replace="fragments/sidebar :: sidebar"></div>

    <div class="container py-5" style="max-width: 900px; width: 100%;margin-left: 450px;">
        <h2 class="mb-4 text-center text-primary fw-bold">Screenshot Monitoring Control Panel</h2>

        <!-- Start Monitoring Card -->
        <div class="card mb-3   shadow-sm">
            <div class="card-body">
                <h5 class="card-title mb-3">Start Monitoring</h5>
                <form action="/admin/screenshot/start" method="post" class="row g-3 align-items-center">
                    <div class="col-md-4">
                        <label class="form-label">Select Employee:</label>
                        <select name="employeeId" class="form-select" required>
                            <option th:each="emp : ${employees}" th:value="${emp.id}" th:text="${emp.name}">Employee
                            </option>
                        </select>
                    </div>

                    <div class="col-md-4">
                        <label class="form-label">Interval (minutes):</label>
                        <input type="number" name="interval" class="form-control" min="1" value="10" required />
                    </div>

                    <div class="col-md-4 mt-5">
                        <button type="submit" class="btn btn-success w-100">Start Monitoring</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Stop Monitoring Card -->
        <div class="card mb-4 shadow-sm">
            <div class="card-body">
                <h5 class="card-title mb-3">Stop Monitoring</h5>
                <form action="/admin/screenshot/stop" method="post" class="row g-3 align-items-center">
                    <div class="col-md-6">
                        <label class="form-label">Stop Monitoring for:</label>
                        <select name="employeeId" class="form-select" required>
                            <option th:each="monitor : ${activeMonitors}" th:value="${monitor.employeeId}"
                                th:text="${employeeNamesMap[monitor.employeeId]}">
                                Monitored Employee
                            </option>

                        </select>
                    </div>

                    <div class="col-md-6 mt-5">
                        <button type="submit" class="btn btn-danger w-100">Stop Monitoring</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Monitored Employees Table -->
        <div class="card shadow-sm">
            <div class="card-body">
                <h5 class="card-title mb-3">Currently Monitored Employees</h5>

                <div style="max-height: 300px; overflow-y: auto;">
                    <table class="table table-bordered table-hover align-middle mb-0">
                        <thead class="table-light sticky-top" style="z-index: 1;">
                            <tr>
                                <th>Employee ID</th>
                                <th>Name</th>
                                <th>Email</th>
                                <th>Designation</th>
                                <th>Employee Code</th>
                                <th class="text-center">Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="monitor : ${activeMonitors}">
                                <td th:text="${monitor.employeeId}">E001</td>
                                <td th:text="${employeeById[monitor.employeeId]?.name}">John Doe</td>
                                <td th:text="${employeeById[monitor.employeeId]?.email}">john@example.com</td>
                                <td th:text="${employeeById[monitor.employeeId]?.designation}">Developer</td>
                                <td th:text="${employeeById[monitor.employeeId]?.employeeCode}">EMP001</td>
                                <td class="text-center">
                                  <form th:action="@{/admin/screenshot/view}" method="get" class="d-inline">
  <input type="hidden" name="employeeId" th:value="${monitor.employeeId}" />
  <button type="submit" class="btn btn-primary btn-sm"
          th:title="${employeeById[monitor.employeeId]?.name}">
    <i class="fas fa-eye me-1"></i> View Screenshots
  </button>
</form>


                                </td>

                            </tr>
                            <tr th:if="${#lists.isEmpty(activeMonitors)}">
                                <td colspan="6" class="text-center text-muted">No employees are currently monitored.
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
