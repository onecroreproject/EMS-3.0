<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Employee Monitoring</title>
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans&display=swap" rel="stylesheet" />

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="stylesheet" th:href="@{/css/styles.css}">

    <style>
      

        h1 {
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 12px;
            border: 1px solid #ccc;
            text-align: center;
        }

        th {
            background-color: #f5f5f5;
        }

        tr:nth-child(even) {
            background-color: #fafafa;
        }

        /* Filter inputs styling */
        .filter-input {
            max-width: 300px;
            margin: 10px 15px 20px 0;
            display: inline-block;
        }
    </style>
</head>

<body>
    <!-- Sidebar Navigation -->
    <div th:replace="fragments/sidebar :: sidebar"></div>

    <div style="margin-left: 300px; padding: 20px;">
        <h1>Late Arrivals</h1>

        <!-- Filters -->
        <input type="text" id="filterEmployeeCode" class="form-control filter-input" placeholder="Filter by Employee Code..." />
        <input type="text" id="filterEmail" class="form-control filter-input" placeholder="Filter by Email..." />
        <input type="date" id="filterDate" class="form-control filter-input" placeholder="Filter by Date..." />

        <table id="lateArrivalsTable">
            <thead>
                <tr>
                    <th>Employee Code</th>
                    <th>Email</th>
                    <th>Date</th>
                    <th>Clock In Time</th>
                    <th>Late By (Minutes)</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="ws : ${lateEmployees}">
                    <td th:text="${ws.employeeCode}">EMP001</td>
                    <td th:text="${ws.email}">email@example.com</td>
                    <td th:text="${#temporals.format(ws.clockIn, 'yyyy-MM-dd')}">2025-08-21</td>
                    <td th:text="${#temporals.format(ws.clockIn, 'hh:mm a')}">10:15 AM</td>
                    <td th:text="
                      ${ 
                        ws.clockIn != null ?
                          (T(java.time.Duration).between(ws.clockIn.toLocalDate().atTime(9, 0), ws.clockIn).toHours() > 0 ? 
                            T(java.time.Duration).between(ws.clockIn.toLocalDate().atTime(9, 0), ws.clockIn).toHours() + ' hr ' : '') + 
                          T(java.time.Duration).between(ws.clockIn.toLocalDate().atTime(9, 0), ws.clockIn).toMinutesPart() + ' mins' 
                        : 'N/A' 
                      }">
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(lateEmployees)}">
                    <td colspan="5">No late arrivals found.</td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Filter function: Employee Code + Email + Date
        function filterTable() {
            const empCodeFilter = document.getElementById('filterEmployeeCode').value.toLowerCase();
            const emailFilter = document.getElementById('filterEmail').value.toLowerCase();
            const dateFilter = document.getElementById('filterDate').value; // yyyy-MM-dd format

            const table = document.getElementById('lateArrivalsTable');
            const rows = table.getElementsByTagName('tbody')[0].getElementsByTagName('tr');

            Array.from(rows).forEach(row => {
                // Skip the "No late arrivals found." row (if present)
                if(row.getElementsByTagName('td').length === 1) return;

                const empCodeCell = row.getElementsByTagName('td')[0];
                const emailCell = row.getElementsByTagName('td')[1];
                const dateCell = row.getElementsByTagName('td')[2];

                const empCodeText = empCodeCell ? empCodeCell.textContent.toLowerCase() : '';
                const emailText = emailCell ? emailCell.textContent.toLowerCase() : '';
                const dateText = dateCell ? dateCell.textContent.trim() : '';

                const empCodeMatch = empCodeText.includes(empCodeFilter);
                const emailMatch = emailText.includes(emailFilter);
                const dateMatch = !dateFilter || dateText === dateFilter;

                if (empCodeMatch && emailMatch && dateMatch) {
                    row.style.display = '';
                } else {
                    row.style.display = 'none';
                }
            });
        }

        // Attach event listeners to filter inputs
        document.getElementById('filterEmployeeCode').addEventListener('input', filterTable);
        document.getElementById('filterEmail').addEventListener('input', filterTable);
        document.getElementById('filterDate').addEventListener('change', filterTable);

        // Sidebar toggle (if exists)
        const toggleBtn = document.getElementById('toggleSidebar');
        if (toggleBtn) {
            toggleBtn.addEventListener('click', () => {
                document.getElementById('sidebar').classList.toggle('sidebar-collapsed');
                document.getElementById('mainContent').classList.toggle('content-expanded');
            });
        }

        // Navigation active link highlight
        const navLinks = document.querySelectorAll('.nav-link');
        navLinks.forEach(link => {
            link.addEventListener('click', () => {
                navLinks.forEach(l => l.classList.remove('active'));
                link.classList.add('active');
            });
        });

        // Simulate loading animations
        document.addEventListener('DOMContentLoaded', function () {
            const animatedElements = document.querySelectorAll('.animate-fadein');
            animatedElements.forEach(el => {
                el.style.opacity = '0';
            });

            setTimeout(() => {
                animatedElements.forEach(el => {
                    el.style.opacity = '1';
                });
            }, 100);
        });
    </script>
</body>

</html>
