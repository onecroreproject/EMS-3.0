<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Organizations</title>
    <!-- Bootstrap 5.3 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome 6.4 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts - Public Sans -->
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <style>
       body {
    font-family: "Public Sans", sans-serif;
    background-color: #f8f9fa; /* light background */
    color: #212529;
}

.main-content {
    margin-left: 280px;
    padding: 2rem;
    background-color: #f8f9fa;
}

.table-container {
    background-color: #ffffff;
    border-radius: 12px;
    padding: 2rem;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
    border: 1px solid #dee2e6;

}

h2 {
    color: #212529;
    font-weight: 600;
    margin-bottom: 1.5rem;
}

.table {
    color: #212529;
    font-size: 0.95rem;
}

.table thead th {
    background-color: #f1f5f9;
    color: #495057;
    font-weight: 600;
    border-bottom: 2px solid #dee2e6;
}

.table tbody tr:hover {
    background-color: #f8f9fa;
}

.table td, .table th {
    vertical-align: middle;
}

.btn-success {
    background-color: #198754;
    border-color: #198754;
    font-weight: 500;
    color: #fff;
}

.btn-warning {
    background-color: #ffc107;
    border-color: #ffc107;
    color: #212529;
    font-weight: 500;
}

.btn-danger {
    background-color: #dc3545;
    border-color: #dc3545;
    color: #fff;
    font-weight: 500;
}

.btn:hover {
    opacity: 0.9;
}

.action-buttons {
    white-space: nowrap;
}

.btn-icon {
    margin-right: 5px;
}

    </style>
</head>

<body>
  <div th:replace="fragments/sidebar :: sidebar"></div>

  <main id="mainContent" class="main-content content-expanded">
    <div class="table-container">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2><i class="fas fa-building me-2"></i>Teams</h2>
            <a href="/teams/new" class="btn btn-success">
                <i class="fas fa-plus btn-icon"></i>Add New Teams
            </a>
        </div>

        <div class="table-responsive">
    <table class="table table-bordered table-hover align-middle">
        <thead class="table-light">
          <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Department</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="team : ${teams}">
            <td th:text="${team.id}">ID</td>
            <td th:text="${team.name}">Name</td>
            <td th:text="${team.departmentName}">Dept</td>
            <td>
                <a th:href="@{'/teams/edit/' + ${team.id}}" class="btn btn-warning btn-sm">Edit</a>
                <a th:href="@{'/teams/delete/' + ${team.id}}"
                   onclick="return confirm('Delete this team?');" class="btn btn-danger btn-sm">Delete</a>
            </td>
          </tr>
        </tbody>
      
 </table>
</div>

    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
      // Toggle sidebar
      document.getElementById('toggleSidebar').addEventListener('click', function () {
          document.getElementById('sidebar').classList.toggle('sidebar-collapsed');
          document.getElementById('mainContent').classList.toggle('content-expanded');
      });

      // Add active class to clicked nav items
      const navLinks = document.querySelectorAll('.nav-link');
      navLinks.forEach(link => {
          link.addEventListener('click', function () {
              navLinks.forEach(l => l.classList.remove('active'));
              this.classList.add('active');
          });
      });

      // Simulate loading animations
      document.addEventListener('DOMContentLoaded', function () {
          const animatedElements = document.querySelectorAll('.animate-fadein');
          animatedElements.forEach(el => {
              el.style.opacity = '0';
          });

          setTimeout(() => {
              animatedElements.forEach(el => {
                  el.style.opacity = '1';
              });
          }, 100);
      });
  </script>
</body>
</html>
