<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Employee Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div th:replace="fragments/sidebar :: sidebar"></div>
    <div class="sidebar-page-content">
    <div class="container mt-4">
    <h2 th:text="${employee.id != null} ? 'Edit Employee' : 'Add Employee'">Employee Form</h2>
    
    <form th:action="@{/save}" th:object="${employee}" method="post">
        <input type="hidden" th:field="*{id}"/>
        
        <div class="mb-3">
            <label class="form-label">Name</label>
            <input type="text" class="form-control" th:field="*{name}" required>
        </div>
        
        <div class="mb-3">
            <label class="form-label">Department</label>
            <select class="form-select" th:field="*{department}">
                <option value="">-- Select Department --</option>
                <option th:each="dept : ${departments}" 
                        th:value="${dept}"
                        th:text="${dept}"
                        th:selected="${dept == employee.department}">
                </option>
            </select>
        </div>
        
        <div class="mb-3">
            <label class="form-label">Salary</label>
            <input type="number" step="0.01" class="form-control" th:field="*{salary}" required>
        </div>
        
        <button type="submit" class="btn btn-primary">Save</button>
        <a href="/" class="btn btn-secondary">Cancel</a>
    </form>
</div>
</div>
</body>
</html>
