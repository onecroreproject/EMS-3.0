<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Add Organization</title>
    <!-- Bootstrap 5.3 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome 6.4 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts - Public Sans -->
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}">

    <style>
    body {
        font-family: "Public Sans", sans-serif;
        background-color: #f4f6f8; 
        color: #212529; /* dark text */
    }

    .container {
       background-color: #ffffff;
        border-radius: 12px;
        padding: 2.5rem;
        margin-left: 350px;
        margin-right: auto;
        max-width: 900px;
        box-shadow: 10px 10px 250px rgba(0, 0, 0, 0.05);
    }

    h2, h4 {
        color: #003366; /* strong corporate navy */
    
        margin-bottom: 1.5rem;
        font-weight: 600;
    }

    .form-control {
        background-color: #ffffff;
        border: 1px solid #ced4da;
        color: #212529;
        padding: 0.75rem;
    }

    .form-control:focus {
        background-color: #ffffff;
        color: #212529;
        border-color: #0d6efd;
        box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.25);
    }

    .form-label {
        color: #0d6efd;
        font-weight: 500;
        margin-bottom: 0.5rem;
    }

    .btn-primary {
        background-color: #0d6efd;
        border-color: #0d6efd;
        color: #ffffff;
        font-weight: 600;
        padding: 0.75rem 1.5rem;
    }

    .btn-primary:hover {
        background-color: #0b5ed7;
        border-color: #0a58ca;
    }

    .btn-link {
        color: #0d6efd !important;
        text-decoration: none;
        font-weight: 500;
    }

    .btn-link:hover {
        color: #0a58ca !important;
        /* text-decoration: underline; */
    }

    .section-divider {
        border-top: 1px solid #dee2e6;
        margin: 2rem 0;
        opacity: 0.7;
    }




    /* =========================================================
       EMS COMMON ADMIN NAVIGATION
       ONE SIDEBAR DESIGN FOR ALL MODULES
       ========================================================= */

    :root {
        --ems-orange: #ff5a00;
        --ems-orange-dark: #e84f00;

        --ems-sidebar: #101820;
        --ems-sidebar-2: #151f29;

        --ems-text: #e8edf2;
        --ems-muted: #94a3b8;

        --ems-border: rgba(255,255,255,0.07);

        --ems-content-bg: #f5f7fa;

        --ems-sidebar-width: 298px;
    }


    /* =========================================================
       BODY
       ========================================================= */

    body {
        margin: 0;
        background: var(--ems-content-bg);
    }


    /* =========================================================
       SIDEBAR
       ========================================================= */

    .ems-sidebar {

        position: fixed;

        top: 0;
        left: 0;
        bottom: 0;

        width: var(--ems-sidebar-width);

        background:
                linear-gradient(
                        180deg,
                        #111820 0%,
                        #0e161d 100%
                );

        color: var(--ems-text);

        display: flex;
        flex-direction: column;

        z-index: 1050;

        border-right:
                1px solid
                rgba(255,255,255,0.05);

        box-shadow:
                5px 0 25px
                rgba(0,0,0,0.12);

        overflow: hidden;

        transition:
                transform 0.25s ease;
    }


    /* =========================================================
       BRAND
       ========================================================= */

    .ems-sidebar-brand {

        height: 84px;

        flex-shrink: 0;

        display: flex;
        align-items: center;

        padding: 0 24px;

        border-bottom:
                1px solid
                var(--ems-border);
    }


    .ems-brand-link {

        width: 100%;

        display: flex;
        align-items: center;

        gap: 13px;

        color: #ffffff;

        text-decoration: none;
    }


    .ems-brand-link:hover {

        color: #ffffff;

        text-decoration: none;
    }


    /* =========================================================
       BRAND ICON
       ========================================================= */

    .ems-brand-icon {

        width: 43px;
        height: 43px;

        flex-shrink: 0;

        border:
                2px solid
                rgba(255,255,255,0.95);

        border-radius: 50%;

        display: flex;
        align-items: center;
        justify-content: center;

        background:
                rgba(255,255,255,0.04);

        color: #ffffff;

        font-size: 21px;

        box-shadow:
                0 0 0 4px
                rgba(255,255,255,0.025);
    }


    /* =========================================================
       BRAND TEXT
       ========================================================= */

    .ems-brand-text {

        display: flex;

        flex-direction: column;

        min-width: 0;
    }


    .ems-brand-name {

        color: #ffffff;

        font-size: 22px;

        font-weight: 700;

        line-height: 1.1;

        letter-spacing: -0.3px;
    }


    .ems-brand-subtitle {

        color: #94a3b8;

        font-size: 10px;

        margin-top: 4px;

        line-height: 1;

        white-space: nowrap;
    }


    /* =========================================================
       SIDEBAR CONTENT
       ========================================================= */

    .ems-sidebar-content {

        flex: 1;

        min-height: 0;

        overflow-y: auto;
        overflow-x: hidden;

        padding:
                12px 11px 18px;
    }


    /* =========================================================
       SIDEBAR SCROLLBAR
       ========================================================= */

    .ems-sidebar-content {

        scrollbar-width: thin;

        scrollbar-color:
                rgba(255,255,255,0.12)
                transparent;
    }


    .ems-sidebar-content::-webkit-scrollbar {

        width: 5px;
    }


    .ems-sidebar-content::-webkit-scrollbar-track {

        background: transparent;
    }


    .ems-sidebar-content::-webkit-scrollbar-thumb {

        background:
                rgba(255,255,255,0.12);

        border-radius: 10px;
    }


    .ems-sidebar-content::-webkit-scrollbar-thumb:hover {

        background:
                rgba(255,90,0,0.45);
    }


    /* =========================================================
       NAV LIST
       ========================================================= */

    .ems-nav-list {

        list-style: none;

        padding: 0;

        margin: 0;
    }


    /* =========================================================
       NAV ITEM
       ========================================================= */

    .ems-nav-item {

        list-style: none;

        margin: 2px 0;

        padding: 0;
    }


    /* =========================================================
       SECTION TITLE
       ========================================================= */

    .ems-section-title {

        list-style: none;

        margin:
                22px 13px 7px;

        padding: 0;

        color: #697786;

        font-size: 10px;

        font-weight: 700;

        letter-spacing: 1px;

        line-height: 1.2;
    }


    /* =========================================================
       MAIN NAV LINK
       ========================================================= */

    .ems-nav-link {

        position: relative;

        width: 100%;

        min-height: 46px;

        box-sizing: border-box;

        padding:
                0 14px;

        display: flex;

        align-items: center;

        justify-content: space-between;

        gap: 10px;

        border-radius: 7px;

        color: #d7dee7;

        background: transparent;

        text-decoration: none;

        font-size: 14px;

        font-weight: 500;

        transition:
                background 0.18s ease,
                color 0.18s ease,
                transform 0.18s ease;
    }


    /* =========================================================
       NAV LINK HOVER
       ========================================================= */

    .ems-nav-link:hover {

        color: #ffffff;

        background:
                rgba(255,255,255,0.055);

        text-decoration: none;

        transform:
                translateX(2px);
    }


    /* =========================================================
       NAV LEFT
       ========================================================= */

    .ems-nav-left {

        min-width: 0;

        flex: 1;

        display: flex;

        align-items: center;

        gap: 13px;
    }


    /* =========================================================
       NAV ICON
       ========================================================= */

    .ems-nav-icon {

        width: 21px;

        min-width: 21px;

        height: 21px;

        display: inline-flex;

        align-items: center;

        justify-content: center;

        color: #b8c2ce;

        font-size: 16px;

        transition:
                color 0.18s ease,
                transform 0.18s ease;
    }


    .ems-nav-link:hover .ems-nav-icon {

        color:
                var(--ems-orange);

        transform:
                scale(1.06);
    }


    /* =========================================================
       NAV TEXT
       ========================================================= */

    .ems-nav-text {

        min-width: 0;

        flex: 1;

        white-space: nowrap;

        overflow: hidden;

        text-overflow: ellipsis;

        line-height: 1.2;
    }


    /* =========================================================
       CHEVRON
       ========================================================= */

    .ems-chevron {

        flex-shrink: 0;

        color: #64748b;

        font-size: 10px;

        transition:
                transform 0.2s ease,
                color 0.2s ease;
    }


    .ems-parent-link:hover .ems-chevron {

        color: #ffffff;
    }


    /* =========================================================
       OPEN PARENT
       ========================================================= */

    .ems-parent-link[aria-expanded="true"] {

        color: #ffffff;

        background:
                rgba(255,255,255,0.035);
    }


    .ems-parent-link[aria-expanded="true"] .ems-chevron {

        color:
                var(--ems-orange);

        transform:
                rotate(90deg);
    }


    /* =========================================================
       NORMAL RIGHT ARROW
       ========================================================= */

    .ems-link-arrow {

        flex-shrink: 0;

        color: #64748b;

        font-size: 9px;

        transition:
                transform 0.18s ease,
                color 0.18s ease;
    }


    .ems-nav-link:hover .ems-link-arrow {

        color:
                var(--ems-orange);

        transform:
                translateX(2px);
    }


    /* =========================================================
       ACTIVE NAVIGATION
       ========================================================= */

    .ems-nav-link.active {

        color: #ffffff;

        background:
                linear-gradient(
                        90deg,
                        var(--ems-orange) 0%,
                        #ff6327 100%
                );

        font-weight: 600;

        box-shadow:
                0 5px 14px
                rgba(255,90,0,0.20);

        transform: none;
    }


    .ems-nav-link.active:hover {

        color: #ffffff;

        background:
                linear-gradient(
                        90deg,
                        var(--ems-orange) 0%,
                        #ff6b2c 100%
                );

        transform: none;
    }


    .ems-nav-link.active .ems-nav-icon {

        color: #ffffff;

        transform: none;
    }


    .ems-nav-link.active .ems-chevron,
    .ems-nav-link.active .ems-link-arrow {

        color: #ffffff;
    }


    /* =========================================================
       ACTIVE LEFT INDICATOR
       ========================================================= */

    .ems-nav-link.active::before {

        content: "";

        position: absolute;

        left: -11px;

        top: 8px;

        bottom: 8px;

        width: 3px;

        border-radius:
                0 4px 4px 0;

        background:
                var(--ems-orange);
    }


    /* =========================================================
       SUBMENU
       ========================================================= */

    .ems-submenu {

        padding:
                4px 0 5px 31px;
    }


    /* =========================================================
       SUBMENU LINK
       ========================================================= */

    .ems-submenu-link {

        position: relative;

        min-height: 36px;

        box-sizing: border-box;

        padding:
                7px 11px;

        margin:
                2px 0;

        display: flex;

        align-items: center;

        gap: 10px;

        border-radius: 6px;

        color: #8f9dac;

        text-decoration: none;

        font-size: 12.5px;

        font-weight: 450;

        transition:
                background 0.18s ease,
                color 0.18s ease,
                padding-left 0.18s ease;
    }


    .ems-submenu-link:hover {

        background:
                rgba(255,255,255,0.045);

        color: #ffffff;

        padding-left:
                15px;

        text-decoration: none;
    }


    .ems-submenu-link i {

        width: 16px;

        min-width: 16px;

        text-align: center;

        font-size: 11px;

        color: #667587;

        transition:
                color 0.18s ease;
    }


    .ems-submenu-link:hover i {

        color:
                var(--ems-orange);
    }


    /* =========================================================
       ACTIVE SUBMENU
       ========================================================= */

    .ems-submenu-link.active {

        background:
                rgba(255,90,0,0.10);

        color: #ffffff;

        font-weight: 600;
    }


    .ems-submenu-link.active::before {

        content: "";

        position: absolute;

        left: 0;

        top: 7px;

        bottom: 7px;

        width: 2px;

        border-radius: 3px;

        background:
                var(--ems-orange);
    }


    .ems-submenu-link.active i {

        color:
                var(--ems-orange);
    }


    /* =========================================================
       DASHBOARD
       ========================================================= */

    .ems-dashboard-link {

        justify-content:
                flex-start;

        gap: 13px;
    }


    .ems-dashboard-link .ems-nav-left {

        flex: 1;
    }


    /* =========================================================
       SIDEBAR FOOTER
       ========================================================= */

    .ems-sidebar-footer {

        flex-shrink: 0;

        padding:
                10px 11px 12px;

        border-top:
                1px solid
                rgba(255,255,255,0.06);

        background:
                rgba(0,0,0,0.08);
    }


    /* =========================================================
       SUPPORT CARD
       ========================================================= */

    .ems-support-card {

        padding:
                13px;

        border:
                1px solid
                rgba(255,255,255,0.08);

        border-radius: 9px;

        background:
                rgba(255,255,255,0.025);

        transition:
                border-color 0.2s ease,
                background 0.2s ease;
    }


    .ems-support-card:hover {

        border-color:
                rgba(255,90,0,0.25);

        background:
                rgba(255,90,0,0.035);
    }


    .ems-support-icon {

        width: 31px;
        height: 31px;

        display: flex;

        align-items: center;
        justify-content: center;

        border-radius: 7px;

        background:
                rgba(255,90,0,0.12);

        color:
                var(--ems-orange);

        font-size: 13px;

        margin-bottom: 8px;
    }


    .ems-support-title {

        color: #ffffff;

        font-size: 12.5px;

        font-weight: 600;
    }


    .ems-support-text {

        margin-top: 4px;

        color: #82909f;

        font-size: 10.5px;

        line-height: 1.45;
    }


    .ems-support-button {

        width: 100%;

        margin-top: 9px;

        padding:
                8px 10px;

        border:
                1px solid
                rgba(255,255,255,0.12);

        border-radius: 6px;

        background:
                rgba(255,255,255,0.035);

        color: #d9e0e7;

        font-size: 11px;

        font-weight: 500;

        cursor: pointer;

        transition:
                background 0.18s ease,
                border-color 0.18s ease,
                color 0.18s ease;
    }


    .ems-support-button:hover {

        background:
                var(--ems-orange);

        border-color:
                var(--ems-orange);

        color: #ffffff;
    }


    /* =========================================================
       COMMON MAIN CONTENT
       ========================================================= */

    /*
       Both names are supported temporarily because some
       existing modules use .main-content and newer modules
       use .ems-main-content.
    */

    .ems-main-content,
    .main-content {

        margin-left:
                var(--ems-sidebar-width);

        min-height:
                100vh;

        transition:
                margin-left 0.25s ease;
    }


    /* =========================================================
       SIDEBAR COLLAPSE
       ========================================================= */

    /*
       Existing admin-home.js uses:
           sidebar-collapsed
           content-expanded

       Keep these classes so we do not break the
       existing dashboard JavaScript.
    */

    .ems-sidebar.sidebar-collapsed {

        transform:
                translateX(
                        calc(-1 * var(--ems-sidebar-width)
                        )
                );
    }


    .main-content.content-expanded,
    .ems-main-content.content-expanded {

        margin-left: 0;
    }


    /* =========================================================
       MOBILE
       ========================================================= */

    @media (max-width: 1100px) {

        :root {

            --ems-sidebar-width: 270px;
        }
    }


    @media (max-width: 768px) {

        .ems-sidebar {

            transform:
                    translateX(-100%);
        }


        .ems-sidebar.mobile-open {

            transform:
                    translateX(0);
        }


        .ems-sidebar.sidebar-collapsed {

            transform:
                    translateX(-100%);
        }


        .ems-main-content,
        .main-content {

            margin-left: 0;
        }
    }





    </style>

   
</head>

<body>
  <div th:replace="fragments/sidebar :: sidebar"></div>

  <main id="mainContent" class="content-expanded p-4">
    <div class="container mt-4">
        <h2><i class="fas fa-building me-2"></i>Add Organization</h2>
        <form th:action="@{/organizations/save}" th:object="${organization}" method="post" class="mt-4">
            <input type="hidden" th:field="*{id}" />
            <!-- First row: Organization Name and Type -->
            <div class="row mb-3">
                <div class="col-md-6">
                    <label for="name" class="form-label">Organization Name</label>
                    <input type="text" th:field="*{name}" id="name" class="form-control" required>
                </div>
                <div class="col-md-6">
                    <label for="type" class="form-label">Organization Type</label>
                    <input type="text" th:field="*{type}" id="type" class="form-control" placeholder="Private, Government, NGO" required>
                </div>
            </div>

            <!-- Second row: Industry and Founded Year -->
            <div class="row mb-3">
                <div class="col-md-6">
                    <label for="industry" class="form-label">Industry</label>
                    <input type="text" th:field="*{industry}" id="industry" class="form-control" placeholder="IT, Education, Manufacturing">
                </div>
                <div class="col-md-6">
                    <label for="foundedYear" class="form-label">Founded Year</label>
                    <input type="number" th:field="*{foundedYear}" id="foundedYear" class="form-control" min="1800" max="2100">
                </div>
            </div>

            <div class="section-divider"></div>
            <h4><i class="fas fa-envelope me-2"></i>Official Contact Information</h4>

            <!-- Third row: Email and Contact Number -->
            <div class="row mb-3">
                <div class="col-md-6">
                    <label for="email" class="form-label">Email Address</label>
                    <input type="email" th:field="*{email}" id="email" class="form-control" required>
                </div>
                <div class="col-md-6">
                    <label for="contactNumber" class="form-label">Primary Contact Number</label>
                    <input type="text" th:field="*{contactNumber}" id="contactNumber" class="form-control" required>
                </div>
            </div>

            <!-- Fourth row: Website URL (full width) -->
            <div class="mb-4">
                <label for="website" class="form-label">Website URL</label>
                <input type="url" th:field="*{website}" id="website" class="form-control" placeholder="https://example.com">
            </div>

            <div class="section-divider"></div>
            <h4><i class="fas fa-map-marker-alt me-2"></i>Head Office Address</h4>

            <div class="mb-3">
                <label for="address" class="form-label">Full Address</label>
                <input type="text" th:field="*{address}" id="address" class="form-control">
            </div>

            <div class="row mb-3">
                <div class="col-md-6">
                    <label for="city" class="form-label">City</label>
                    <input type="text" th:field="*{city}" id="city" class="form-control">
                </div>
                <div class="col-md-6">
                    <label for="state" class="form-label">State/Province</label>
                    <input type="text" th:field="*{state}" id="state" class="form-control">
                </div>
            </div>

            <div class="row mb-4">
                <div class="col-md-6">
                    <label for="country" class="form-label">Country</label>
                    <input type="text" th:field="*{country}" id="country" class="form-control">
                </div>
                <div class="col-md-6">
                    <label for="postalCode" class="form-label">Postal Code</label>
                    <input type="text" th:field="*{postalCode}" id="postalCode" class="form-control">
                </div>
            </div>

            <div class="d-flex justify-content-between align-items-center mt-5">
                <button type="submit" class="btn btn-primary px-4 py-2">
                    <i class="fas fa-save me-2"></i>Save Organization
                </button>
                <a href="/organizations/list" class="btn btn-link">
                    <i class="fas fa-arrow-left me-2"></i>Back to List
                </a>
            </div>
        </form>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
      // Toggle sidebar
      document.getElementById('toggleSidebar').addEventListener('click', function () {
          document.getElementById('sidebar').classList.toggle('sidebar-collapsed');
          document.getElementById('mainContent').classList.toggle('content-expanded');
      });

      // Add active class to clicked nav items
      const navLinks = document.querySelectorAll('.nav-link');
      navLinks.forEach(link => {
          link.addEventListener('click', function () {
              navLinks.forEach(l => l.classList.remove('active'));
              this.classList.add('active');
          });
      });

      // Simulate loading animations
      document.addEventListener('DOMContentLoaded', function () {
          const animatedElements = document.querySelectorAll('.animate-fadein');
          animatedElements.forEach(el => {
              el.style.opacity = '0';
          });

          setTimeout(() => {
              animatedElements.forEach(el => {
                  el.style.opacity = '1';
              });
          }, 100);
      });
  </script>
</body>
</html>
