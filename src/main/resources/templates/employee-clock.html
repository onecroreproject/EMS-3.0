<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Dashboard | Employee Monitoring</title>
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans&display=swap" rel="stylesheet" />

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/empstyle.css}">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;

        }

        body {
            background: linear-gradient(135deg, #1a2a6c, #b21f1f, #fdbb2d);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        @keyframes gradientBG {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            animation: fadeIn 0.8s ease-out;
            margin-left: 400px;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        header {
            background: linear-gradient(to right, #2c3e50, #4ca1af);
            color: white;
            padding: 25px;
            text-align: center;
            position: relative;
            min-width: 100%;

        }

        header h2 {
            font-size: 28px;
            margin-bottom: 5px;
            letter-spacing: 1px;
        }

        .datetime {
            font-size: 18px;
            margin-top: 10px;
            font-weight: 500;
        }

        .content {
            padding: 30px;
        }

        .clock-actions {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 30px;
        }

        .clock-btn {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .clock-in,
        .clock-out {
            width: 100%;
            padding: 20px;
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 20px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .clock-in {
            background: linear-gradient(to right, #00b09b, #96c93d);
        }

        .clock-out {
            background: linear-gradient(to right, #ff416c, #ff4b2b);
        }

        .clock-in:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
        }

        .clock-out:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
        }

        .clock-in:active,
        .clock-out:active {
            transform: translateY(0);
        }

        .status {
            text-align: center;
            margin: 20px 0;
            padding: 15px;
            border-radius: 10px;
            background: #f8f9fa;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% {
                box-shadow: 0 0 0 0 rgba(0, 180, 155, 0.4);
            }

            70% {
                box-shadow: 0 0 0 10px rgba(0, 180, 155, 0);
            }

            100% {
                box-shadow: 0 0 0 0 rgba(0, 180, 155, 0);
            }
        }

        .status h3 {
            color: #2c3e50;
            margin-bottom: 10px;
        }

        .status p {
            font-size: 18px;
            color: #00b09b;
            font-weight: 600;
        }

        .message {
            text-align: center;
            padding: 15px;
            margin: 20px 0;
            border-radius: 10px;
            background: #e8f4fc;
            color: #0a6ebd;
            font-weight: 500;
            animation: slideIn 0.5s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .navigation {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
        }

        .nav-btn {
            display: inline-block;
            padding: 12px 25px;
            background: linear-gradient(to right, #3a7bd5, #00d2ff);
            color: white;
            text-decoration: none;
            border-radius: 50px;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .nav-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        }

        .nav-btn i {
            margin-right: 8px;
        }



        @media (max-width: 600px) {
            .clock-actions {
                flex-direction: column;
            }

            .navigation {
                flex-direction: column;
                align-items: center;
            }

            .nav-btn {
                width: 100%;
                text-align: center;
            }
        }
    </style>

</head>

<body>
    <div th:replace="fragments/usersidebar :: sidebar"></div>


    <div class="container">
        <header>
            <h2><i class="fas fa-clock"></i> Employee Time Tracker</h2>
            <div class="datetime">
                <span id="date"></span> | <span id="time"></span>
            </div>
        </header>

        <div class="content">
            <div class="clock-actions">
                <div class="clock-btn">
                    <form id="clockInForm" action="/employee/time/clock-in" method="post">
                        <input type="hidden" name="lat" id="lat">
                        <input type="hidden" name="lon" id="lon">
                        <input type="hidden" name="address" id="addressField">
                        <button type="submit" class="clock-in">
                            <i class="fas fa-sign-in-alt"></i> Clock In
                        </button>
                    </form>

                </div>

                <div class="clock-btn">
                    <form action="/employee/time/clock-out" method="post">
                        <button type="submit" class="clock-out">
                            <i class="fas fa-sign-out-alt"></i> Clock Out
                        </button>
                    </form>
                </div>
            </div>

            <div class="status">
                <h3>Current Status</h3>
                <p id="status-text">Not Clocked In</p>
            </div>

            <div class="message">
                <p>Welcome! Please clock in when starting your work.</p>
            </div>

            <div class="navigation">
                <a href="/employee/time/break" class="nav-btn">
                    <i class="fas fa-coffee"></i> Break Time
                </a>
                <a href="/employee/time/history" class="nav-btn">
                    <i class="fas fa-history"></i> Work History
                </a>
            </div>
        </div>


    </div>
<script>
const clockInForm = document.getElementById('clockInForm');

clockInForm.addEventListener('submit', function(event) {
    if (navigator.geolocation) {
        event.preventDefault(); // prevent immediate submit

        navigator.geolocation.getCurrentPosition(function(position) {
            const lat = position.coords.latitude;
            const lon = position.coords.longitude;

            // Optional: Reverse geocode
            fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lon}`)
                .then(res => res.json())
                .then(data => {
                    let addr = '';
                    if (data.address) {
                        const a = data.address;
                        const parts = [
                            a.neighbourhood || a.suburb || a.village || a.hamlet,
                            a.city_district || a.city || a.town || a.county,
                            a.state_district || a.state,
                            a.country
                        ].filter(Boolean);
                        addr = parts.join(', ');
                    }

                    // Set hidden inputs
                    document.getElementById('lat').value = lat;
                    document.getElementById('lon').value = lon;
                    document.getElementById('addressField').value = addr;

                    // Submit form after setting location
                    clockInForm.submit();
                })
                .catch(err => {
                    console.error('Reverse geocode failed, submitting lat/lon only', err);
                    document.getElementById('lat').value = lat;
                    document.getElementById('lon').value = lon;
                    clockInForm.submit();
                });
        }, function(err) {
            console.error('Geolocation failed', err);
            // Submit without location if denied
            clockInForm.submit();
        }, { enableHighAccuracy: true, timeout: 10000 });

    } else {
        console.error('Geolocation not supported');
        // submit without location
        clockInForm.submit();
    }
});
</script>

    <script>
        // Update date and time
        function updateDateTime() {
            const now = new Date();

            // Format date
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            document.getElementById('date').textContent = now.toLocaleDateString('en-US', options);

            // Format time
            document.getElementById('time').textContent = now.toLocaleTimeString('en-US');
        }

        // Initial call
        updateDateTime();

        // Update every second
        setInterval(updateDateTime, 1000);

        // Add animation to buttons when clicked
        document.querySelectorAll('button').forEach(button => {
            button.addEventListener('click', function () {
                this.style.transform = 'scale(0.95)';
                setTimeout(() => {
                    this.style.transform = '';
                }, 200);
            });
        });

        // Simulate status change for demo purposes
        setTimeout(() => {
            document.getElementById('status-text').textContent = "Clocked In - Active";
            document.querySelector('.message p').textContent = "Successfully clocked in at 9:00 AM";
        }, 2000);
    </script>

    <!-- Bootstrap & Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</html>
