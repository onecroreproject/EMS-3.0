<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Task List</title>

    <!-- Bootstrap -->
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
            rel="stylesheet">

    <!-- Font Awesome -->
    <link
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
            rel="stylesheet">

    <!-- Public Sans -->
    <link
            href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap"
            rel="stylesheet">

    <!-- Existing Project CSS -->
    <link
            rel="stylesheet"
            th:href="@{/css/styles.css}">


    <style>

        /* =========================================================
           GLOBAL
        ========================================================== */

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
        }

        body {
            font-family: "Public Sans", sans-serif;
            background: #f5f7fb;
            color: #14213d;
            overflow-x: hidden;
        }


        /* =========================================================
           PAGE
        ========================================================== */

        .ems-page {
            width: 100%;
            min-height: 100vh;
            display: flex;
            align-items: stretch;
        }


        /* =========================================================
           SIDEBAR

           EXISTING SIDEBAR - DO NOT CHANGE
        ========================================================== */

        .ems-sidebar {
            width: 260px;
            min-width: 260px;
            flex: 0 0 260px;
            position: relative;
            z-index: 9999;
        }


        /* =========================================================
           CONTENT
        ========================================================== */

        .ems-content {
            flex: 1;
            min-width: 0;
            padding: 18px 24px 25px 28px;
        }


        /* =========================================================
           HEADER
        ========================================================== */

        .task-header {
            width: 100%;
            max-width: 1260px;
            min-height: 66px;
            margin: 0 auto 15px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 20px;
        }

        .task-header-left {
            display: flex;
            align-items: center;
            gap: 15px;
            min-width: 0;
        }

        .task-header-icon {
            width: 64px;
            height: 64px;
            min-width: 64px;

            border-radius: 15px;

            background: #edf5ff;
            color: #1268e9;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 29px;
        }

        .task-header-title {
            margin: 0;

            font-size: 30px;
            line-height: 1.15;
            font-weight: 700;

            color: #10213f;
        }

        .task-header-subtitle {
            margin: 5px 0 0;

            font-size: 14px;
            color: #72819a;
        }


        /* =========================================================
           HEADER RIGHT
        ========================================================== */

        .header-right {
            display: flex;
            align-items: flex-end;
            flex-direction: column;
            gap: 8px;
        }

        .breadcrumb-area {
            display: flex;
            align-items: center;
            gap: 10px;

            font-size: 13px;
            color: #687994;

            white-space: nowrap;
        }

        .breadcrumb-area i {
            font-size: 12px;
        }

        .breadcrumb-current {
            color: #31496c;
            font-weight: 600;
        }

        .create-task-button {
            height: 40px;
            padding: 0 17px;

            border-radius: 7px;
            border: none;

            background: #0d6efd;
            color: #ffffff;

            text-decoration: none;

            display: inline-flex;
            align-items: center;
            justify-content: center;

            gap: 8px;

            font-size: 14px;
            font-weight: 600;

            box-shadow:
                    0 4px 12px rgba(13, 110, 253, .18);

            transition: .15s ease;
        }

        .create-task-button:hover {
            background: #0967d9;
            color: #ffffff;
            transform: translateY(-1px);
        }


        /* =========================================================
           SUMMARY
        ========================================================== */

        .summary-grid {
            width: 100%;
            max-width: 1260px;

            margin: 0 auto 16px;

            display: grid;
            grid-template-columns: repeat(5, minmax(0, 1fr));

            gap: 12px;
        }

        .summary-card {
            min-height: 78px;

            background: #ffffff;

            border: 1px solid #e0e7ef;
            border-radius: 9px;

            padding: 10px 13px;

            display: flex;
            align-items: center;

            gap: 12px;

            box-shadow:
                    0 3px 12px rgba(20, 40, 70, .035);
        }

        .summary-icon {
            width: 48px;
            height: 48px;
            min-width: 48px;

            border-radius: 14px;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 21px;
        }

        .summary-total .summary-icon {
            background: #e7f1ff;
            color: #1268e9;
        }

        .summary-completed .summary-icon {
            background: #e3f8ed;
            color: #16a66a;
        }

        .summary-progress .summary-icon {
            background: #fff1d8;
            color: #f09a00;
        }

        .summary-registered .summary-icon {
            background: #edf1f5;
            color: #516275;
        }

        .summary-pending .summary-icon {
            background: #ffe7e9;
            color: #e5484d;
        }

        .summary-content {
            min-width: 0;
        }

        .summary-label {
            font-size: 12px;
            color: #687994;
            margin-bottom: 3px;
        }

        .summary-value {
            font-size: 21px;
            line-height: 1;

            font-weight: 700;
            color: #17243d;
        }


        /* =========================================================
           FILTER
        ========================================================== */

        .filter-card {
            width: 100%;
            max-width: 1260px;

            margin: 0 auto 16px;

            padding: 13px 14px;

            background: #ffffff;

            border: 1px solid #e0e7ef;
            border-radius: 10px;

            box-shadow:
                    0 3px 12px rgba(20, 40, 70, .035);
        }

        .filter-layout {
            display: grid;

            grid-template-columns: 295px minmax(0, 1fr);

            gap: 14px;

            align-items: end;
        }

        .filter-label {
            display: block;

            margin-bottom: 6px;

            font-size: 12px;
            font-weight: 600;

            color: #33445f;
        }


        /* =========================================================
           SEARCH
        ========================================================== */

        .search-wrapper {
            position: relative;
        }

        .search-icon {
            position: absolute;

            left: 13px;
            top: 50%;

            transform: translateY(-50%);

            color: #536983;

            font-size: 14px;

            pointer-events: none;

            z-index: 2;
        }

        .search-input {
            width: 100%;
            height: 42px;

            padding: 0 13px 0 38px;

            border: 1px solid #d3ddea;
            border-radius: 8px;

            outline: none;

            font-size: 13px;

            color: #33445f;
            background: #ffffff;
        }

        .search-input::placeholder {
            color: #8a98ab;
        }

        .search-input:focus {
            border-color: #73a9f4;

            box-shadow:
                    0 0 0 3px rgba(13, 110, 253, .07);
        }


        /* =========================================================
           FILTER CONTROLS
        ========================================================== */

        .filters {
            display: grid;

            grid-template-columns:
                    repeat(4, minmax(130px, 1fr))
                    auto
                    auto;

            gap: 9px;

            align-items: end;
        }

        .filter-select {
            width: 100%;
            height: 42px;

            padding: 0 31px 0 11px;

            border: 1px solid #d3ddea;
            border-radius: 8px;

            background: #ffffff;
            color: #34445d;

            font-size: 13px;

            outline: none;
            cursor: pointer;
        }

        .filter-select:focus {
            border-color: #73a9f4;

            box-shadow:
                    0 0 0 3px rgba(13, 110, 253, .07);
        }

        .reset-button,
        .apply-button {
            height: 42px;

            border-radius: 8px;

            padding: 0 16px;

            font-size: 13px;
            font-weight: 600;

            display: inline-flex;
            align-items: center;
            justify-content: center;

            gap: 6px;

            cursor: pointer;
        }

        .reset-button {
            border: 1px solid #d8e2ed;

            background: #f1f6fb;
            color: #36506e;
        }

        .reset-button:hover {
            background: #e9f0f7;
        }

        .apply-button {
            border: 1px solid #0d6efd;

            background: #0d6efd;
            color: #ffffff;
        }

        .apply-button:hover {
            background: #0967d9;
        }


        /* =========================================================
           TABLE
        ========================================================== */

        .table-card {
            width: 100%;
            max-width: 1260px;

            margin: 0 auto;

            background: #ffffff;

            border: 1px solid #e0e7ef;
            border-radius: 10px;

            padding: 10px 10px 8px;

            box-shadow:
                    0 3px 12px rgba(20, 40, 70, .035);

            overflow: hidden;
        }

        .table-responsive {
            width: 100%;
            overflow-x: auto;
        }

        .task-table {
            width: 100%;
            min-width: 1080px;

            border-collapse: separate;
            border-spacing: 0;

            table-layout: fixed;

            font-size: 13px;
        }

        .task-table th {
            height: 42px;

            padding: 0 9px;

            background: #edf5fd;

            border-bottom: 1px solid #dce6f0;

            color: #263b58;

            font-size: 12px;
            font-weight: 700;

            text-align: left;

            white-space: nowrap;
        }

        .task-table th:first-child {
            border-top-left-radius: 7px;
        }

        .task-table th:last-child {
            border-top-right-radius: 7px;
        }

        .task-table td {
            height: 52px;

            padding: 7px 9px;

            border-bottom: 1px solid #edf0f4;

            color: #2d3c53;

            vertical-align: middle;

            overflow: hidden;

            text-overflow: ellipsis;

            white-space: nowrap;
        }

        .task-table tbody tr:hover {
            background: #f8fbff;
        }

        .task-table tbody tr:last-child td {
            border-bottom: none;
        }


        /* =========================================================
           COLUMN WIDTHS
        ========================================================== */

        .col-number {
            width: 4%;
        }

        .col-title {
            width: 16%;
        }

        .col-assigned-to {
            width: 13%;
        }

        .col-assigned-by {
            width: 13%;
        }

        .col-type {
            width: 11%;
        }

        .col-start {
            width: 9%;
        }

        .col-end {
            width: 9%;
        }

        .col-status {
            width: 10%;
        }

        .col-priority {
            width: 7%;
        }

        .col-actions {
            width: 8%;
        }


        /* =========================================================
           SORT
        ========================================================== */

        .sort-header {
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .sort-icon {
            font-size: 9px;
            color: #91a0b3;
        }


        /* =========================================================
           NUMBER
        ========================================================== */

        .row-number {
            color: #56677f;
            font-weight: 600;
        }


        /* =========================================================
           TITLE
        ========================================================== */

        .task-title {
            font-weight: 600;
            color: #17243d;
        }


        /* =========================================================
           EMPLOYEE
        ========================================================== */

        .employee-cell {
            display: flex;
            align-items: center;

            gap: 7px;

            min-width: 0;
        }

        .employee-avatar {
            width: 28px;
            height: 28px;

            min-width: 28px;

            border-radius: 50%;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #5b8fbd;
            color: #ffffff;

            font-size: 11px;
            font-weight: 700;
        }

        .assigned-by-avatar {
            background: #6b91b6;
        }

        .employee-name {
            overflow: hidden;

            text-overflow: ellipsis;

            white-space: nowrap;
        }


        /* =========================================================
           TASK TYPE
        ========================================================== */

        .type-badge {
            display: inline-flex;

            align-items: center;
            justify-content: center;

            min-height: 28px;

            padding: 0 9px;

            border-radius: 7px;

            font-size: 11px;
            font-weight: 600;

            white-space: nowrap;
        }

        .type-development {
            background: #dfeeff;
            color: #1268e9;
        }

        .type-training {
            background: #dff7e9;
            color: #078657;
        }

        .type-support {
            background: #ffe3e7;
            color: #d63345;
        }

        .type-project {
            background: #eee4ff;
            color: #6941c6;
        }

        .type-mentoring {
            background: #fff0d4;
            color: #b76500;
        }

        .type-default {
            background: #edf1f5;
            color: #516275;
        }


        /* =========================================================
           DATE
        ========================================================== */

        .date-value {
            color: #40516a;
            font-size: 12px;
        }


        /* =========================================================
           STATUS
        ========================================================== */

        .status-badge {
            display: inline-flex;

            align-items: center;
            justify-content: center;

            min-height: 27px;

            padding: 0 9px;

            border-radius: 6px;

            font-size: 11px;
            font-weight: 600;

            white-space: nowrap;
        }

        .status-assigned {
            background: #fff0c9;
            color: #a66a00;
        }

        .status-accepted {
            background: #e4f0ff;
            color: #1268e9;
        }

        .status-progress {
            background: #dcecff;
            color: #1268e9;
        }

        .status-completed {
            background: #dff5e8;
            color: #12834f;
        }

        .status-registered {
            background: #edf1f5;
            color: #566579;
        }

        .status-pending {
            background: #fff0cf;
            color: #a36a00;
        }

        .status-hold {
            background: #e4f1f7;
            color: #37738d;
        }

        .status-cancelled {
            background: #ffe1e4;
            color: #d43a48;
        }

        .status-deferred {
            background: #edf0f4;
            color: #5c6878;
        }

        .status-review {
            background: #e7e9ff;
            color: #514db2;
        }

        .status-default {
            background: #edf1f5;
            color: #526277;
        }


        /* =========================================================
           PRIORITY
        ========================================================== */

        .priority-badge {
            display: inline-flex;

            align-items: center;
            justify-content: center;

            min-height: 27px;

            padding: 0 9px;

            border-radius: 6px;

            font-size: 11px;
            font-weight: 600;

            white-space: nowrap;
        }

        .priority-low {
            background: #dcf6e9;
            color: #078657;
        }

        .priority-medium {
            background: #fff0b8;
            color: #a46b00;
        }

        .priority-high {
            background: #ffe0e3;
            color: #d33b48;
        }

        .priority-default {
            background: #edf1f5;
            color: #526277;
        }


        /* =========================================================
           ACTION BUTTONS
        ========================================================== */

        .action-buttons {
            display: flex;

            align-items: center;

            gap: 7px;
        }

        .action-button {
            width: 36px;
            height: 32px;

            border-radius: 6px;

            display: inline-flex;

            align-items: center;
            justify-content: center;

            text-decoration: none;

            border: none;

            font-size: 13px;

            transition: .15s ease;
        }

        .edit-button {
            background: #ffe98f;
            color: #765b00;
        }

        .edit-button:hover {
            background: #ffdf5a;
            color: #5c4700;
        }

        .delete-button {
            background: #ff4b52;
            color: #ffffff;
        }

        .delete-button:hover {
            background: #dc3038;
            color: #ffffff;
        }


        /* =========================================================
           EMPTY / LOADING
        ========================================================== */

        .empty-state {
            padding: 45px 20px !important;

            text-align: center;

            color: #75849a;
        }

        .empty-state i {
            display: block;

            margin-bottom: 9px;

            font-size: 28px;

            color: #b5c0ce;
        }


        /* =========================================================
           FOOTER
        ========================================================== */

        .table-footer {
            display: flex;

            align-items: center;

            justify-content: space-between;

            padding: 12px 8px 3px;

            gap: 15px;
        }

        .showing-text {
            font-size: 12px;
            color: #63738a;
        }

        .pagination {
            display: flex;

            align-items: center;

            gap: 4px;

            margin: 0;
        }

        .page-button {
            min-width: 34px;
            height: 32px;

            padding: 0 9px;

            border: 1px solid #dce4ed;
            border-radius: 6px;

            background: #ffffff;
            color: #455a74;

            font-size: 12px;

            display: inline-flex;

            align-items: center;
            justify-content: center;

            cursor: pointer;
        }

        .page-button:hover {
            background: #f3f7fb;
        }

        .page-button.active {
            background: #0d6efd;

            color: #ffffff;

            border-color: #0d6efd;
        }

        .page-button:disabled {
            opacity: .5;
            cursor: default;
        }


        /* =========================================================
           RESPONSIVE
        ========================================================== */

        @media (max-width: 1450px) {

            .ems-sidebar {
                width: 250px;
                min-width: 250px;
                flex-basis: 250px;
            }

            .ems-content {
                padding-left: 20px;
                padding-right: 18px;
            }

            .summary-grid {
                grid-template-columns:
                        repeat(5, minmax(150px, 1fr));
            }

            .filter-layout {
                grid-template-columns: 260px 1fr;
            }

            .filters {
                grid-template-columns:
                        repeat(4, minmax(110px, 1fr))
                        auto
                        auto;
            }
        }

        @media (max-width: 1200px) {

            .ems-page {
                display: block;
            }

            .ems-sidebar {
                width: 100%;
                min-width: 100%;
            }

            .ems-content {
                padding: 20px;
            }

            .summary-grid {
                grid-template-columns:
                        repeat(3, 1fr);
            }

            .filter-layout {
                grid-template-columns: 1fr;
            }

            .filters {
                grid-template-columns:
                        repeat(2, 1fr);
            }
        }

        @media (max-width: 768px) {

            .ems-content {
                padding: 15px;
            }

            .task-header {
                align-items: flex-start;
                flex-direction: column;
            }

            .header-right {
                width: 100%;
                align-items: flex-start;
            }

            .breadcrumb-area {
                display: none;
            }

            .summary-grid {
                grid-template-columns: 1fr 1fr;
            }

            .filters {
                grid-template-columns: 1fr;
            }

            .table-footer {
                align-items: flex-start;
                flex-direction: column;
            }
        }

        @media (max-width: 500px) {

            .summary-grid {
                grid-template-columns: 1fr;
            }
        }

    </style>

</head>


<body>

<div class="ems-page">


    <!-- =========================================================
         EXISTING SIDEBAR

         DO NOT CHANGE
    ========================================================== -->

    <aside class="ems-sidebar">

        <div th:replace="fragments/sidebar :: sidebar"></div>

    </aside>


    <!-- =========================================================
         MAIN CONTENT
    ========================================================== -->

    <main class="ems-content">


        <!-- HEADER -->

        <header class="task-header">

            <div class="task-header-left">

                <div class="task-header-icon">
                    <i class="fa-regular fa-clipboard"></i>
                </div>

                <div>

                    <h1 class="task-header-title">
                        Task List
                    </h1>

                    <p class="task-header-subtitle">
                        View and manage all assigned tasks
                    </p>

                </div>

            </div>


            <div class="header-right">

                <div class="breadcrumb-area">

                    <i class="fa-solid fa-house"></i>

                    <span>Home</span>

                    <span>›</span>

                    <span>Tasks</span>

                    <span>›</span>

                    <span class="breadcrumb-current">
                        Task List
                    </span>

                </div>


                <a
                        href="/tasks/new"
                        class="create-task-button">

                    <i class="fa-solid fa-plus"></i>

                    Create New Task

                </a>

            </div>

        </header>


        <!-- =====================================================
             SUMMARY
        ====================================================== -->

        <section class="summary-grid">


            <div class="summary-card summary-total">

                <div class="summary-icon">
                    <i class="fa-solid fa-list"></i>
                </div>

                <div class="summary-content">

                    <div class="summary-label">
                        Total Tasks
                    </div>

                    <div
                            class="summary-value"
                            id="totalTasks">
                        0
                    </div>

                </div>

            </div>


            <div class="summary-card summary-completed">

                <div class="summary-icon">
                    <i class="fa-solid fa-circle-check"></i>
                </div>

                <div class="summary-content">

                    <div class="summary-label">
                        Completed
                    </div>

                    <div
                            class="summary-value"
                            id="completedTasks">
                        0
                    </div>

                </div>

            </div>


            <div class="summary-card summary-progress">

                <div class="summary-icon">
                    <i class="fa-regular fa-clock"></i>
                </div>

                <div class="summary-content">

                    <div class="summary-label">
                        In Progress
                    </div>

                    <div
                            class="summary-value"
                            id="progressTasks">
                        0
                    </div>

                </div>

            </div>


            <div class="summary-card summary-registered">

                <div class="summary-icon">
                    <i class="fa-solid fa-list-check"></i>
                </div>

                <div class="summary-content">

                    <div class="summary-label">
                        Registered
                    </div>

                    <div
                            class="summary-value"
                            id="registeredTasks">
                        0
                    </div>

                </div>

            </div>


            <div class="summary-card summary-pending">

                <div class="summary-icon">
                    <i class="fa-solid fa-triangle-exclamation"></i>
                </div>

                <div class="summary-content">

                    <div class="summary-label">
                        Pending
                    </div>

                    <div
                            class="summary-value"
                            id="pendingTasks">
                        0
                    </div>

                </div>

            </div>


        </section>


        <!-- =====================================================
             FILTERS
        ====================================================== -->

        <section class="filter-card">

            <div class="filter-layout">


                <!-- SEARCH -->

                <div>

                    <label class="filter-label">
                        Search Task
                    </label>

                    <div class="search-wrapper">

                        <i
                                class="fa-solid fa-magnifying-glass search-icon">
                        </i>

                        <input
                                type="text"
                                id="searchInput"
                                class="search-input"
                                placeholder="Search by title, employee, type...">

                    </div>

                </div>


                <!-- FILTERS -->

                <div class="filters">


                    <!-- EMPLOYEE -->

                    <div>

                        <label class="filter-label">
                            Employee
                        </label>

                        <select
                                id="employeeFilter"
                                class="filter-select">

                            <option value="">
                                All Employees
                            </option>

                        </select>

                    </div>


                    <!-- TASK TYPE -->

<script>

    "use strict";


    /* =========================================================
       CONFIGURATION
    ========================================================== */

    const TASK_API_URL = "/api/tasks";

    const ROWS_PER_PAGE = 7;

    let allTasks = [];

    let filteredTasks = [];

    let currentPage = 1;


    /* =========================================================
       NORMALIZE
    ========================================================== */

    function normalize(value) {

        return value == null
            ? ""
            : String(value).trim().toLowerCase();

    }


    function normalizeStatus(value) {

        const v = normalize(value)
            .replace(/-/g, "_")
            .replace(/\s+/g, "_");

        if (v === "ongoing")
            return "IN_PROGRESS";

        if (v === "in_progress")
            return "IN_PROGRESS";

        if (v === "registered")
            return "REGISTERED";

        if (v === "pending")
            return "PENDING";

        if (v === "completed")
            return "COMPLETED";

        if (v === "assigned")
            return "ASSIGNED";

        if (v === "accepted")
            return "ACCEPTED";

        if (v === "on_hold")
            return "ON_HOLD";

        if (v === "cancelled")
            return "CANCELLED";

        if (v === "deferred")
            return "DEFERRED";

        if (v === "review")
            return "REVIEW";

        return v.toUpperCase();
    }


    function normalizePriority(value) {

        return normalize(value).toUpperCase();

    }


    function normalizeTaskType(value) {

        return normalize(value).toUpperCase();

    }


    /* =========================================================
       HTML ESCAPE
    ========================================================== */

    function escapeHtml(value) {

        return String(value ?? "")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");

    }


    /* =========================================================
       DATE FORMAT

       API:
       2026-09-17

       UI:
       17-09-2026
    ========================================================== */

    function formatDate(value) {

        if (!value) {
            return "-";
        }

        const text = String(value).trim();

        const match =
            text.match(/^(\d{4})-(\d{2})-(\d{2})$/);

        if (match) {

            return (
                match[3] +
                "-" +
                match[2] +
                "-" +
                match[1]
            );

        }

        return text;

    }


    /* =========================================================
       INITIAL
    ========================================================== */

    function getInitial(name, fallback) {

        const value =
            String(name ?? "").trim();

        if (!value) {
            return fallback;
        }

        return value
            .charAt(0)
            .toUpperCase();

    }


    /* =========================================================
       TASK TYPE CLASS
    ========================================================== */

    function getTypeClass(type) {

        switch (normalizeTaskType(type)) {

            case "DEVELOPMENT":
                return "type-development";

            case "TRAINING":
                return "type-training";

            case "SUPPORT":
                return "type-support";

            case "PROJECT":
                return "type-project";

            case "MENTORING":
                return "type-mentoring";

            default:
                return "type-default";

        }

    }


    /* =========================================================
       STATUS CLASS
    ========================================================== */

    function getStatusClass(status) {

        switch (normalizeStatus(status)) {

            case "ASSIGNED":
                return "status-assigned";

            case "ACCEPTED":
                return "status-accepted";

            case "IN_PROGRESS":
                return "status-progress";

            case "COMPLETED":
                return "status-completed";

            case "REGISTERED":
                return "status-registered";

            case "PENDING":
                return "status-pending";

            case "ON_HOLD":
                return "status-hold";

            case "CANCELLED":
                return "status-cancelled";

            case "DEFERRED":
                return "status-deferred";

            case "REVIEW":
                return "status-review";

            default:
                return "status-default";

        }

    }


    /* =========================================================
       PRIORITY CLASS
    ========================================================== */

    function getPriorityClass(priority) {

        switch (normalizePriority(priority)) {

            case "LOW":
                return "priority-low";

            case "MEDIUM":
                return "priority-medium";

            case "HIGH":
                return "priority-high";

            default:
                return "priority-default";

        }

    }


    /* =========================================================
       DISPLAY STATUS
    ========================================================== */

    function displayStatus(status) {

        if (!status) {
            return "-";
        }

        const normalized =
            normalizeStatus(status);

        const labels = {

            ASSIGNED: "Assigned",

            ACCEPTED: "Accepted",

            IN_PROGRESS: "In Progress",

            REGISTERED: "Registered",

            PENDING: "Pending",

            COMPLETED: "Completed",

            ON_HOLD: "On Hold",

            CANCELLED: "Cancelled",

            DEFERRED: "Deferred",

            REVIEW: "Review"

        };

        return labels[normalized]
            || String(status);

    }


    /* =========================================================
       DISPLAY TASK TYPE
    ========================================================== */

    function displayTaskType(type) {

        if (!type) {
            return "-";
        }

        const normalized =
            normalizeTaskType(type);

        const labels = {

            DEVELOPMENT: "Development",

            TRAINING: "Training",

            SUPPORT: "Support",

            PROJECT: "Project",

            MENTORING: "Mentoring"

        };

        return labels[normalized]
            || String(type);

    }


    /* =========================================================
       DISPLAY PRIORITY
    ========================================================== */

    function displayPriority(priority) {

        if (!priority) {
            return "-";
        }

        const normalized =
            normalizePriority(priority);

        const labels = {

            LOW: "Low",

            MEDIUM: "Medium",

            HIGH: "High"

        };

        return labels[normalized]
            || String(priority);

    }


    /* =========================================================
       CREATE TABLE ROW
    ========================================================== */

    function createTaskRow(task, rowNumber) {

        const id =
            task.id || "";

        const title =
            task.title || "-";

        const assignedTo =
            task.assignedTo || "-";

        const assignedBy =
            task.assignedBy || "Admin";

        const taskType =
            task.taskType || "";

        const startDate =
            formatDate(task.startDate);

        const endDate =
            formatDate(task.endDate);

        const status =
            task.status || "";

        const priority =
            task.priority || "";


        return `

            <tr class="task-row">


                <!-- NUMBER -->

                <td>

                    <span class="row-number">

                        ${rowNumber}

                    </span>

                </td>


                <!-- TITLE -->

                <td>

                    <span
                            class="task-title"
                            title="${escapeHtml(title)}">

                        ${escapeHtml(title)}

                    </span>

                </td>


                <!-- ASSIGNED TO -->

                <td>

                    <div class="employee-cell">

                        <div class="employee-avatar">

                            ${escapeHtml(
            getInitial(
                assignedTo,
                "U"
            )
        )}

                        </div>

                        <span
                                class="employee-name"
                                title="${escapeHtml(assignedTo)}">

                            ${escapeHtml(assignedTo)}

                        </span>

                    </div>

                </td>


                <!-- ASSIGNED BY -->

                <td>

                    <div class="employee-cell">

                        <div
                                class="employee-avatar assigned-by-avatar">

                            ${escapeHtml(
            getInitial(
                assignedBy,
                "A"
            )
        )}

                        </div>

                        <span
                                class="employee-name"
                                title="${escapeHtml(assignedBy)}">

                            ${escapeHtml(assignedBy)}

                        </span>

                    </div>

                </td>


                <!-- TASK TYPE -->

                <td>

                    <span
                            class="type-badge ${getTypeClass(taskType)}">

                        ${escapeHtml(
            displayTaskType(taskType)
        )}

                    </span>

                </td>


                <!-- START DATE -->

                <td>

                    <span class="date-value">

                        ${escapeHtml(startDate)}

                    </span>

                </td>


                <!-- END DATE -->

                <td>

                    <span class="date-value">

                        ${escapeHtml(endDate)}

                    </span>

                </td>


                <!-- STATUS -->

                <td>

                    <span
                            class="status-badge ${getStatusClass(status)}">

                        ${escapeHtml(
            displayStatus(status)
        )}

                    </span>

                </td>


                <!-- PRIORITY -->

                <td>

                    <span
                            class="priority-badge ${getPriorityClass(priority)}">

                        ${escapeHtml(
            displayPriority(priority)
        )}

                    </span>

                </td>


                <!-- ACTIONS -->

                <td>

                    <div class="action-buttons">


                        <!-- EDIT -->

                        <a
                                href="/tasks/edit/${encodeURIComponent(id)}"
                                class="action-button edit-button"
                                title="Edit Task">

                            <i class="fa-solid fa-pen-to-square"></i>

                        </a>


                        <!-- DELETE -->

                        <a
                                href="/tasks/delete/${encodeURIComponent(id)}"
                                class="action-button delete-button"
                                title="Delete Task"
                                onclick="return confirm('Are you sure you want to delete this task?');">

                            <i class="fa-solid fa-trash"></i>

                        </a>


                    </div>

                </td>


            </tr>

        `;

    }


    /* =========================================================
       RENDER TABLE
    ========================================================== */

    function renderTable() {

        const tbody =
            document.getElementById(
                "taskTableBody"
            );

        tbody.innerHTML = "";


        if (filteredTasks.length === 0) {

            tbody.innerHTML = `

                <tr>

                    <td
                            colspan="10"
                            class="empty-state">

                        <i class="fa-regular fa-folder-open"></i>

                        No tasks match the selected filters.

                        <br>

                        <small>
                            Try changing the search
                            or filter values.
                        </small>

                    </td>

                </tr>

            `;

            updateShowingText();

            renderPagination();

            return;
        }


        const start =
            (currentPage - 1) *
            ROWS_PER_PAGE;


        const end =
            start + ROWS_PER_PAGE;


        const visibleTasks =
            filteredTasks.slice(
                start,
                end
            );


        visibleTasks.forEach(
            (task, index) => {

                tbody.insertAdjacentHTML(
                    "beforeend",

                    createTaskRow(
                        task,
                        start + index + 1
                    )
                );

            }
        );


        updateShowingText();

        renderPagination();

    }


    /* =========================================================
       FILTER
    ========================================================== */

    function applyFilters() {

        const search =
            normalize(
                document.getElementById(
                    "searchInput"
                ).value
            );


        const employee =
            normalize(
                document.getElementById(
                    "employeeFilter"
                ).value
            );


        const type =
            normalizeTaskType(
                document.getElementById(
                    "typeFilter"
                ).value
            );


        const status =
            normalizeStatus(
                document.getElementById(
                    "statusFilter"
                ).value
            );


        const priority =
            normalizePriority(
                document.getElementById(
                    "priorityFilter"
                ).value
            );


        filteredTasks =
            allTasks.filter(task => {


                const title =
                    normalize(task.title);


                const assignedTo =
                    normalize(task.assignedTo);


                const assignedBy =
                    normalize(task.assignedBy);


                const taskType =
                    normalizeTaskType(
                        task.taskType
                    );


                const taskStatus =
                    normalizeStatus(
                        task.status
                    );


                const taskPriority =
                    normalizePriority(
                        task.priority
                    );


                const searchableText =

                    title +
                    " " +
                    assignedTo +
                    " " +
                    assignedBy +
                    " " +
                    taskType;


                return (

                    (!search ||
                        searchableText.includes(search))

                    &&

                    (!employee ||
                        assignedTo === employee)

                    &&

                    (!type ||
                        taskType === type)

                    &&

                    (!status ||
                        taskStatus === status)

                    &&

                    (!priority ||
                        taskPriority === priority)

                );

            });


        currentPage = 1;

        renderTable();

    }


    /* =========================================================
       SUMMARY
    ========================================================== */

    function updateStatistics() {

        let completed = 0;

        let progress = 0;

        let registered = 0;

        let pending = 0;


        allTasks.forEach(task => {

            const status =
                normalizeStatus(
                    task.status
                );


            if (status === "COMPLETED") {
                completed++;
            }


            if (status === "IN_PROGRESS") {
                progress++;
            }


            if (status === "REGISTERED") {
                registered++;
            }


            if (status === "PENDING") {
                pending++;
            }

        });


        document.getElementById(
            "totalTasks"
        ).textContent =
            allTasks.length;


        document.getElementById(
            "completedTasks"
        ).textContent =
            completed;


        document.getElementById(
            "progressTasks"
        ).textContent =
            progress;


        document.getElementById(
            "registeredTasks"
        ).textContent =
            registered;


        document.getElementById(
            "pendingTasks"
        ).textContent =
            pending;

    }


    /* =========================================================
       EMPLOYEE FILTER
    ========================================================== */

    function populateEmployeeFilter() {

        const select =
            document.getElementById(
                "employeeFilter"
            );


        select.innerHTML = `

            <option value="">
                All Employees
            </option>

        `;


        const employees = [

            ...new Set(

                allTasks

                    .map(
                        task =>
                            task.assignedTo
                    )

                    .filter(
                        value =>
                            value &&
                            String(value).trim()
                    )

                    .map(
                        value =>
                            String(value).trim()
                    )

            )

        ];


        employees.sort(
            (a, b) =>
                a.localeCompare(b)
        );


        employees.forEach(
            employee => {

                const option =
                    document.createElement(
                        "option"
                    );


                option.value =
                    employee;


                option.textContent =
                    employee;


                select.appendChild(
                    option
                );

            }
        );

    }


    /* =========================================================
       SHOWING TEXT
    ========================================================== */

    function updateShowingText() {

        const element =
            document.getElementById(
                "showingText"
            );


        const total =
            filteredTasks.length;


        if (total === 0) {

            element.textContent =
                "Showing 0 of 0 tasks";

            return;
        }


        const start =
            ((currentPage - 1) *
                ROWS_PER_PAGE) + 1;


        const end =
            Math.min(
                currentPage *
                ROWS_PER_PAGE,
                total
            );


        element.textContent =

            "Showing " +
            start +
            " to " +
            end +
            " of " +
            total +
            " tasks";

    }


    /* =========================================================
       PAGINATION
    ========================================================== */

    function renderPagination() {

        const pagination =
            document.getElementById(
                "pagination"
            );


        pagination.innerHTML = "";


        const totalPages =
            Math.ceil(
                filteredTasks.length /
                ROWS_PER_PAGE
            );


        if (totalPages <= 1) {
            return;
        }


        /* PREVIOUS */

        const previous =
            document.createElement(
                "button"
            );


        previous.type =
            "button";


        previous.className =
            "page-button";


        previous.textContent =
            "Previous";


        previous.disabled =
            currentPage === 1;


        previous.addEventListener(
            "click",
            function () {

                if (currentPage > 1) {

                    currentPage--;

                    renderTable();

                }

            }
        );


        pagination.appendChild(
            previous
        );


        /* PAGE NUMBERS */

        for (
            let page = 1;
            page <= totalPages;
            page++
        ) {

            const button =
                document.createElement(
                    "button"
                );


            button.type =
                "button";


            button.className =
                "page-button";


            if (
                page === currentPage
            ) {

                button.classList.add(
                    "active"
                );

            }


            button.textContent =
                page;


            button.addEventListener(
                "click",
                function () {

                    currentPage =
                        page;

                    renderTable();

                }
            );


            pagination.appendChild(
                button
            );

        }


        /* NEXT */

        const next =
            document.createElement(
                "button"
            );


        next.type =
            "button";


        next.className =
            "page-button";


        next.textContent =
            "Next";


        next.disabled =
            currentPage === totalPages;


        next.addEventListener(
            "click",
            function () {

                if (
                    currentPage <
                    totalPages
                ) {

                    currentPage++;

                    renderTable();

                }

            }
        );


        pagination.appendChild(
            next
        );

    }


    /* =========================================================
       RESET
    ========================================================== */

    function resetFilters() {

        document.getElementById(
            "searchInput"
        ).value = "";


        document.getElementById(
            "employeeFilter"
        ).value = "";


        document.getElementById(
            "typeFilter"
        ).value = "";


        document.getElementById(
            "statusFilter"
        ).value = "";


        document.getElementById(
            "priorityFilter"
        ).value = "";


        applyFilters();

    }


    /* =========================================================
       LOAD TASKS FROM API

       THIS IS THE IMPORTANT FIX.
    ========================================================== */

    async function loadTasks() {

        const tbody =
            document.getElementById(
                "taskTableBody"
            );


        try {

            tbody.innerHTML = `

                <tr>

                    <td
                            colspan="10"
                            class="empty-state">

                        <i
                                class="fa-solid fa-spinner fa-spin">
                        </i>

                        Loading tasks...

                    </td>

                </tr>

            `;


            console.log(
                "Loading tasks from:",
                TASK_API_URL
            );


            const response =
                await fetch(
                    TASK_API_URL,
                    {
                        method: "GET",

                        cache: "no-store",

                        headers: {
                            "Accept":
                                "application/json"
                        }
                    }
                );


            if (!response.ok) {

                throw new Error(
                    "Task API returned HTTP " +
                    response.status
                );

            }


            const data =
                await response.json();


            if (!Array.isArray(data)) {

                throw new Error(
                    "Task API response is not an array."
                );

            }


            /*
             * Store API response.
             */

            allTasks = data;


            console.log(
                "Tasks received:",
                allTasks
            );


            /*
             * Update UI.
             */

            populateEmployeeFilter();

            updateStatistics();

            applyFilters();

        }
        catch (error) {

            console.error(
                "Unable to load tasks:",
                error
            );


            allTasks = [];

            filteredTasks = [];


            document.getElementById(
                "totalTasks"
            ).textContent = "0";


            document.getElementById(
                "completedTasks"
            ).textContent = "0";


            document.getElementById(
                "progressTasks"
            ).textContent = "0";


            document.getElementById(
                "registeredTasks"
            ).textContent = "0";


            document.getElementById(
                "pendingTasks"
            ).textContent = "0";


            tbody.innerHTML = `

                <tr>

                    <td
                            colspan="10"
                            class="empty-state">

                        <i
                                class="fa-solid fa-triangle-exclamation">
                        </i>

                        Unable to load tasks.

                        <br>

                        <small>

                            ${escapeHtml(
                error.message
            )}

                        </small>

                    </td>

                </tr>

            `;


            document.getElementById(
                "showingText"
            ).textContent =
                "Showing 0 of 0 tasks";

        }

    }


    /* =========================================================
       INITIALIZE
    ========================================================== */

    document.addEventListener(
        "DOMContentLoaded",
        function () {


            /*
             * Apply button
             */

            document.getElementById(
                "applyButton"
            ).addEventListener(
                "click",
                applyFilters
            );


            /*
             * Reset button
             */

            document.getElementById(
                "resetButton"
            ).addEventListener(
                "click",
                resetFilters
            );


            /*
             * Search Enter
             */

            document.getElementById(
                "searchInput"
            ).addEventListener(
                "keydown",
                function (event) {

                    if (
                        event.key === "Enter"
                    ) {

                        applyFilters();

                    }

                }
            );


            /*
             * Filter changes
             */

            document.getElementById(
                "employeeFilter"
            ).addEventListener(
                "change",
                applyFilters
            );


            document.getElementById(
                "typeFilter"
            ).addEventListener(
                "change",
                applyFilters
            );


            document.getElementById(
                "statusFilter"
            ).addEventListener(
                "change",
                applyFilters
            );


            document.getElementById(
                "priorityFilter"
            ).addEventListener(
                "change",
                applyFilters
            );


            /*
             * LOAD API
             */

            loadTasks();

        }
    );

</script>


</body>

</html>
