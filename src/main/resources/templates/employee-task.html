<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Employee Dashboard | Employee Monitoring</title>
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/empstyle.css}">
</head>

<body>
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <div class="col-md-3 col-lg-2 p-0">
                <div th:replace="fragments/usersidebar :: sidebar"></div>
            </div>

            <!-- Main Content -->
            <div class="col-md-9 col-lg-10 p-4" style="margin-left: 300px; width: 79%;">
                <h2 class="mb-4">Task List</h2>

                <p><strong>Logged in as:</strong> <span th:text="${employee.name}"></span></p>


                <div class="table-responsive">
                    <table class="table table-bordered table-hover align-middle">
                        <thead class="table-light">
                            <tr>
                                <th>Title</th>
                                <th>Assigned To</th>
                                <th>Start</th>
                                <th>End</th>
                                <th>Status</th>
                                <th>Priority</th>
                                <th>Edit</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="task : ${tasks}">
                                <td th:text="${task.title}"></td>
                                <td th:text="${task.assignedTo}"></td>
                                <td th:text="${task.startDate}"></td>
                                <td th:text="${task.endDate}"></td>
                                <td>
                                    <button type="button" th:text="${task.status}" th:classappend="
        ${task.status == 'Registered'} ? 'btn btn-secondary text-white' :
        (${task.status == 'Pending'} ? 'btn btn-warning text-dark' :
        (${task.status == 'In Progress' or task.status == 'Ongoing'} ? 'btn btn-primary text-white' :
        (${task.status == 'On Hold'} ? 'btn btn-info text-white' :
        (${task.status == 'Completed'} ? 'btn btn-success text-white' :
        (${task.status == 'Cancelled'} ? 'btn btn-danger text-white' :
        (${task.status == 'Deferred'} ? 'btn btn-secondary text-white' :
        (${task.status == 'Review'} ? 'btn btn-dark text-white' : 'btn btn-light')))))))">
                                    </button>
                                </td>

                                <td>
                                    <button type="button" th:text="${task.priority}"
                                        th:classappend="
                                    ${task.priority == 'Low'} ? 'btn btn-success btn-sm' :
                                    (${task.priority == 'Medium'} ? 'btn btn-warning btn-sm text-dark' :
                                    (${task.priority == 'High'} ? 'btn btn-danger btn-sm' : 'btn btn-secondary btn-sm rounded-pill'))">
                                    </button>
                                </td>
                                <td>
                                    <!-- Edit Status Button -->
                                    <button class="btn btn-sm btn-warning" data-bs-toggle="modal"
                                        th:attr="data-bs-target='#editStatusModal__' + ${task.id}">
                                        <i class="fa fa-edit"></i> Edit
                                    </button>

                                    <!-- Modal for Updating Status -->
                                    <div class="modal fade" th:id="'editStatusModal__' + ${task.id}" tabindex="-1"
                                        aria-hidden="true">
                                        <div class="modal-dialog">
                                            <div class="modal-content">
                                                <form th:action="@{/tasks/updateStatus}" method="post">
                                                    <div class="modal-header">
                                                        <h5 class="modal-title">Update Task Status</h5>
                                                        <button type="button" class="btn-close"
                                                            data-bs-dismiss="modal"></button>
                                                    </div>
                                                    <div class="modal-body">
                                                        <input type="hidden" name="taskId" th:value="${task.id}" />
                                                        <div class="mb-3">
                                                            <label for="status" class="form-label">Status</label>
                                                            <select class="form-select" name="status">
                                                                <option th:selected="${task.status == 'Pending'}">
                                                                    Pending</option>
                                                                <option th:selected="${task.status == 'In Progress'}">In
                                                                    Progress</option>
                                                                <option th:selected="${task.status == 'Ongoing'}">
                                                                    Ongoing</option>
                                                                <option th:selected="${task.status == 'On Hold'}">On
                                                                    Hold</option>
                                                                <option th:selected="${task.status == 'Completed'}">
                                                                    Completed</option>
                                                                <option th:selected="${task.status == 'Cancelled'}">
                                                                    Cancelled</option>
                                                                <option th:selected="${task.status == 'Deferred'}">
                                                                    Deferred</option>
                                                                <option th:selected="${task.status == 'Review'}">Review
                                                                </option>
                                                            </select>
                                                        </div>
                                                    </div>
                                                    <div class="modal-footer">
                                                        <button type="button" class="btn btn-secondary"
                                                            data-bs-dismiss="modal">Cancel</button>
                                                        <button type="submit" class="btn btn-primary">Update</button>
                                                    </div>
                                                </form>
                                            </div>
                                        </div>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</body>

</html>
