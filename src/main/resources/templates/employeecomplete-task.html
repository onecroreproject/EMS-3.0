<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Employee Dashboard | Employee Monitoring</title>
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/empstyle.css}">
</head>

<body>
    <div class="container-fluid">
        <div class="row">
            <div class="col-md-3 col-lg-2 p-0">
                <div th:replace="fragments/usersidebar :: sidebar"></div>
            </div>

            <div class="col-md-9 col-lg-8 mt-5 ms-5">
                <h2 class="mb-4">Completed Tasks</h2>

               <p>
    <strong>Logged in as:</strong> <span th:text="${employee.name}"></span><br/>
    
</p>

                <div class="table-responsive">
                    <table class="table table-bordered table-hover align-middle">
                        <thead class="table-light">
                            <tr>
                                <th>Title</th>
                                <th>Assigned To</th>
                                <th>Start</th>
                                <th>End</th>
                                <th>Status</th>
                                <th>Priority</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="task : ${tasks}">
                                <td th:text="${task.title}">Title</td>
                                <td th:text="${task.assignedTo}">Assigned</td>
                                <td th:text="${task.startDate}">Start</td>
                                <td th:text="${task.endDate}">End</td>
                                <td>
                                    <span class="btn btn-success btn-sm" th:text="${task.status}">Completed</span>
                                </td>
                                <td>
                                    <span th:text="${task.priority}"
                                        th:classappend="(
                                            ${task.priority == 'Low'} ? 'btn btn-success btn-sm' :
                                            (${task.priority == 'Medium'} ? 'btn btn-warning btn-sm text-dark' :
                                            (${task.priority == 'High'} ? 'btn btn-danger btn-sm' : 'btn btn-secondary btn-sm'))
                                        )">
                                    </span>
                                </td>
                            </tr>
                            <tr th:if="${tasks.size() == 0}">
                                <td colspan="6" class="text-center">No completed tasks available.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</html>
