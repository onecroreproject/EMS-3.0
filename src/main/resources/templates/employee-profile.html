<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Dashboard | Employee Monitoring</title>
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
   
   
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/empstyle.css}">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Public Sans', sans-serif;
        }
        
        body {
            background-color: #f5f7fa;
            color: #333;
            padding: 20px;
            min-height: 100vh;
        }
        
        .dashboard-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            gap: 30px;
        }
        
        .main-content {
            flex: 1;
            background: #fff;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
            padding: 30px;
        }
        
      .header-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 25px;
    padding-bottom: 15px;
    border-bottom: 1px solid #eee;
    flex-wrap: wrap; /* Ensures it works on smaller screens */
}

.page-title {
    color: #2c3e50;
    font-weight: 600;
    margin: 0;
}
        
        .profile-card {
            background: linear-gradient(135deg, #4b6cb7 0%, #182848 100%);
            border-radius: 15px;
            color: white;
            padding: 30px;
            margin-bottom: 30px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
        }
        
        .profile-card::before {
            content: "";
            position: absolute;
            width: 200px;
            height: 200px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            top: -100px;
            right: -100px;
        }
        
        .profile-card::after {
            content: "";
            position: absolute;
            width: 150px;
            height: 150px;
            background: rgba(255, 255, 255, 0.07);
            border-radius: 50%;
            bottom: -70px;
            left: -70px;
        }
        
        .profile-header {
            display: flex;
            align-items: center;
            margin-bottom: 25px;
        }
        
        .profile-icon {
            width: 80px;
            height: 80px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 20px;
            font-size: 2.5rem;
        }
        
        .profile-info h2 {
            font-size: 1.8rem;
            margin-bottom: 5px;
            font-weight: 600;
        }
        
        .profile-info p {
            opacity: 0.9;
            font-size: 1.1rem;
        }
        
        .details-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }
        
        .detail-item {
            background: rgba(255, 255, 255, 0.1);
            padding: 15px;
            border-radius: 10px;
            backdrop-filter: blur(5px);
        }
        
        .detail-item strong {
            display: block;
            font-size: 0.9rem;
            opacity: 0.8;
            margin-bottom: 5px;
        }
        
        .detail-item span {
            font-size: 1.1rem;
        }
        
        .status-badge {
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 600;
            margin-top: 10px;
        }
        
        .status-active {
            background: #00bc8c;
            color: white;
        }
        
        .status-inactive {
            background: #e74c3c;
            color: white;
        }
        
       .action-buttons a.btn-logout {
    background-color: #e74c3c;
    color: white;
    padding: 8px 16px;
    border-radius: 5px;
    text-decoration: none;
   
    transition: background-color 0.3s ease;
}

        
        .btn-logout {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 50px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
        }
        
        .btn-logout:hover {
            background: #c0392b;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(231, 76, 60, 0.4);
            color: white;
            text-decoration: none;
        }
        
        
        
        @media (max-width: 768px) {
            .dashboard-container {
                flex-direction: column;
            }
            
            .details-grid {
                grid-template-columns: 1fr;
            }
            
            .profile-header {
                flex-direction: column;
                text-align: center;
            }
            
            .profile-icon {
                margin-right: 0;
                margin-bottom: 15px;
            }
        }
    </style>
</head>


<body>
    <div th:replace="fragments/usersidebar :: sidebar"></div>


    <div class="dashboard-container">
        <div class="main-content">
           
           <div class="header-row">
    <h1 class="page-title">Profile</h1>
    <div class="action-buttons">
        <a href="/logout" class="btn-logout">
            <i class="fas fa-sign-out-alt"></i> Logout
        </a>
    </div>
</div>

            <div class="profile-card">
                <div class="profile-header">
                    <div class="profile-icon">
                        <i class="fas fa-user-tie"></i>
                    </div>
                    <div class="profile-info">
                        <h2 th:text="${employee.name}">John Doe</h2>
                        <p th:text="${employee.designation}">Developer</p>
                    </div>
                </div>
                
                <div class="details-grid">
                    <div class="detail-item">
                        <strong>Employee ID</strong>
                        <span th:text="${employee.id}">12345</span>
                    </div>
                    <div class="detail-item">
                        <strong>Email</strong>
                        <span th:text="${employee.email}">john@example.com</span>
                    </div>
                    <div class="detail-item">
                        <strong>Phone</strong>
                        <span th:text="${employee.phone}">1234567890</span>
                    </div>
                    <div class="detail-item">
                        <strong>Address</strong>
                        <span th:text="${employee.address}">123 Main St</span>
                    </div>
                    <div class="detail-item">
                        <strong>Department</strong>
                        <span th:text="${employee.departmentName}">IT</span>
                    </div>
                    <div class="detail-item">
                        <strong>Team</strong>
                        <span th:text="${employee.teamName}">Alpha</span>
                    </div>
                    <div class="detail-item">
                        <strong>Joining Date</strong>
                        <span th:text="${#dates.format(employee.joiningDate, 'yyyy-MM-dd')}">2024-01-01</span>
                    </div>
                    <div class="detail-item">
                        <strong>Employee Code</strong>
                        <span th:text="${employee.employeeCode}">EMP123</span>
                    </div>
                    <div class="detail-item">
                        <strong>Status</strong>
                        <span th:text="${employee.status}">Active</span>
                        <div class="status-badge" th:classappend="${employee.status == 'Active'} ? 'status-active' : 'status-inactive'" th:text="${employee.status}">Active</div>
                    </div>
                </div>
            </div>
            
           
        </div>
    </div>

    <!-- Bootstrap & Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</body>

</html>
