<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Search Employee</title>
    <!-- Bootstrap 5.3 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome 6.4 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts - Public Sans -->
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
   <style>
        body {
            font-family: "Public Sans", sans-serif;
            background-color: #f8f9fa;
            color: #212529;
        }

        .main-container {
            margin-left: 280px;
            padding: 2rem;
            transition: all 0.3s;
        }

        .search-container {
            background-color: #ffffff;
            border-radius: 12px;
            padding: 2rem;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            border: 1px solid #dee2e6;
            margin-bottom: 2rem;
        }

        .result-container {
            background-color: #ffffff;
            border-radius: 12px;
            padding: 2rem;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            border: 1px solid #dee2e6;
        }

        h2 {
            color: #212529;
            font-weight: 600;
            margin-bottom: 1.5rem;
        }

        h4 {
            color: #212529;
            font-weight: 600;
            margin-bottom: 1.25rem;
        }

        .form-label {
            font-weight: 500;
            color: #495057;
        }

        .btn-primary {
            background-color: #0d6efd;
            border-color: #0d6efd;
            font-weight: 500;
            padding: 0.5rem 1.5rem;
        }

        .btn-primary:hover {
            background-color: #0b5ed7;
            border-color: #0a58ca;
        }

        .error-message {
            color: #dc3545;
            font-weight: 500;
        }

        .employee-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
        }

        .employee-table th {
            background-color: #f1f5f9;
            color: #495057;
            font-weight: 600;
            padding: 1rem;
            width: 30%;
        }

        .employee-table td {
            padding: 1rem;
            background-color: #ffffff;
        }

        .employee-table tr:not(:last-child) td {
            border-bottom: 1px solid #dee2e6;
        }

        .employee-table tr:hover td {
            background-color: #f8f9fa;
        }
    </style>
</head>

<body>
  <div th:replace="fragments/sidebar :: sidebar"></div>

  <div class="main-container">
    <div class="search-container">
        <h2>Search Employee</h2>

        <!-- Search Form -->
        <form th:action="@{/employees/search}" method="post" class="mb-4">
            <div class="row">
                <div class="col-md-8 mb-3">
                    <label for="searchQuery" class="form-label">Enter Employee Code / Email / Phone:</label>
                    <input type="text" id="searchQuery" name="query" class="form-control form-control-lg"
                           placeholder="EMP001 / john@email.com / 9876543210" required />
                </div>
                <div class="col-md-4 d-flex align-items-end mb-3">
                    <button type="submit" class="btn btn-primary btn-lg w-100">
                        <i class="fas fa-search me-2"></i>Search
                    </button>
                </div>
            </div>
        </form>

        <!-- Error Message -->
        <div class="alert alert-danger" th:if="${error}" th:text="${error}" role="alert"></div>
    </div>

    <!-- Search Result -->
    <div class="result-container" th:if="${employee != null}">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h4>Employee Details</h4>
            <a th:href="@{'/employees/edit/' + ${employee.id}}" class="btn btn-outline-primary">
                <i class="fas fa-edit me-2"></i>Edit
            </a>
        </div>
        
        <table class="employee-table">
            <tr>
                <th>Name</th>
                <td th:text="${employee.name}"></td>
            </tr>
            <tr>
                <th>Email</th>
                <td th:text="${employee.email}"></td>
            </tr>
            <tr>
                <th>Phone</th>
                <td th:text="${employee.phone}"></td>
            </tr>
            <tr>
                <th>Designation</th>
                <td th:text="${employee.designation}"></td>
            </tr>
            <tr>
                <th>Employee Code</th>
                <td th:text="${employee.employeeCode}"></td>
            </tr>
            <tr>
                <th>Status</th>
                <td th:text="${employee.status}"></td>
            </tr>
            <tr>
                <th>Joining Date</th>
                <td th:text="${#dates.format(employee.joiningDate, 'yyyy-MM-dd')}"></td>
            </tr>
        </table>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
      // Toggle sidebar
      document.getElementById('toggleSidebar').addEventListener('click', function () {
          document.getElementById('sidebar').classList.toggle('sidebar-collapsed');
          document.querySelector('.main-container').classList.toggle('expanded');
      });

      // Add active class to clicked nav items
      const navLinks = document.querySelectorAll('.nav-link');
      navLinks.forEach(link => {
          link.addEventListener('click', function () {
              navLinks.forEach(l => l.classList.remove('active'));
              this.classList.add('active');
          });
      });

      // Focus on search input when page loads
      document.addEventListener('DOMContentLoaded', function () {
          const searchInput = document.getElementById('searchQuery');
          if (searchInput) {
              searchInput.focus();
          }
      });
  </script>
</body>
</html>
