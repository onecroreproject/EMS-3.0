<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure MFA Verification</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #4361ee;
            --secondary-color: #3f37c9;
            --accent-color: #4895ef;
            --light-color: #f8f9fa;
            --dark-color: #212529;
            --success-color: #4cc9f0;
            --border-radius: 12px;
            --box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        }
        
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
                
        }
        
        .mfa-container {
            background: white;
            border-radius: var(--border-radius);
            box-shadow: var(--box-shadow);
            width: 100%;
            max-width: 450px;
            padding: 2.5rem;
            text-align: center;
             position: fixed;
             height: 570px;
               font-family: "Public Sans", sans-serif;  
          font-weight: bolder;
            /* font-size: 2rem;  */
        }
        
        .logo {
            width: 80px;
            height: 80px;
            background: var(--primary-color);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
        }
        
        .logo i {
            font-size: 2.5rem;
            color: white;
        }
        
        h2 {
            color: var(--dark-color);
            margin-bottom: 1.5rem;
            font-weight: 600;
        }
        
        .instruction {
            color: #6c757d;
            margin-bottom: 1.8rem;
            line-height: 1.6;
            
        }
        
        .otp-input-container {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 2rem;
        }
        
        .otp-input {
            width: 55px;
            height: 60px;
            text-align: center;
            font-size: 1.5rem;
            font-weight: 600;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            transition: all 0.3s;
        }
        
        .otp-input:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px rgba(72, 149, 239, 0.2);
            outline: none;
        }
        
        .btn-verify {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 28px;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            width: 100%;
            margin-bottom: 1.5rem;
        }
        
        .btn-verify:hover {
            background: var(--secondary-color);
            transform: translateY(-2px);
        }
        
        .support-links {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 1.5rem;
        }
        
        .support-links a {
            color: #6c757d;
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.3s;
        }
        
        .support-links a:hover {
            color: var(--primary-color);
        }
        
        .countdown {
            color: var(--accent-color);
            font-weight: 600;
            margin-top: 1rem;
        }
        
        
        
        @media (max-width: 576px) {
            .mfa-container {
                padding: 2rem 1.5rem;
            }
            
            .otp-input {
                width: 45px;
                height: 50px;
                font-size: 1.2rem;
            }
        }
    </style>
</head>
<body>
    <div class="mfa-container">
        <div class="logo">
            <i class="fas fa-lock"></i>
        </div>
        
        <h2>Two-Factor Verification</h2>
        
        <p class="instruction">Open your authenticator app to get your verification code. Enter the 6-digit code below to continue.</p>
        
        <form th:action="@{/mfa/verify}" method="post">
            <div class="otp-input-container">
                <input type="text" class="otp-input" maxlength="1" pattern="[0-9]*" inputmode="numeric" autocomplete="one-time-code" required>
                <input type="text" class="otp-input" maxlength="1" pattern="[0-9]*" inputmode="numeric" required>
                <input type="text" class="otp-input" maxlength="1" pattern="[0-9]*" inputmode="numeric" required>
                <input type="text" class="otp-input" maxlength="1" pattern="[0-9]*" inputmode="numeric" required>
                <input type="text" class="otp-input" maxlength="1" pattern="[0-9]*" inputmode="numeric" required>
                <input type="text" class="otp-input" maxlength="1" pattern="[0-9]*" inputmode="numeric" required>
            </div>
            
            <input type="hidden" name="code" id="fullCode">
            
            <button type="submit" class="btn-verify">Verify & Continue</button>
        </form>
        
        <div class="countdown">Code expires in: <span id="timer">30 seconds</span></div>
        
        
        
        <div class="support-links">
            <a href="#"><i class="fas fa-question-circle"></i> Help</a>
            <a href="#"><i class="fas fa-envelope"></i> Contact support</a>
        </div>
    </div>

    <script>
        // OTP input automation
        const inputs = document.querySelectorAll('.otp-input');
        const form = document.querySelector('form');
        const hiddenInput = document.getElementById('fullCode');
        
        inputs.forEach((input, index) => {
            input.addEventListener('input', (e) => {
                // Allow only numbers
                e.target.value = e.target.value.replace(/[^0-9]/g, '');
                
                // Auto focus to next input
                if (e.target.value !== '' && index < inputs.length - 1) {
                    inputs[index + 1].focus();
                }
                
                updateHiddenInput();
            });
            
            input.addEventListener('keydown', (e) => {
                // Move to previous input on backspace
                if (e.key === 'Backspace' && e.target.value === '' && index > 0) {
                    inputs[index - 1].focus();
                }
            });
        });
        
        function updateHiddenInput() {
            hiddenInput.value = Array.from(inputs).map(input => input.value).join('');
        }
        
        // Countdown timer
        function startTimer(duration, display) {
            let timer = duration, minutes, seconds;
            const interval = setInterval(function () {
                minutes = parseInt(timer / 60, 10);
                seconds = parseInt(timer % 60, 10);
                
                minutes = minutes < 10 ? "0" + minutes : minutes;
                seconds = seconds < 10 ? "0" + seconds : seconds;
                
                display.textContent = minutes + ":" + seconds;
                
                if (--timer < 0) {
                    clearInterval(interval);
                    document.getElementById('resend-link').style.color = 'var(--primary-color)';
                    document.getElementById('resend-link').style.fontWeight = '600';
                }
            }, 1000);
        }
        
        window.onload = function () {
            const fiveMinutes = 60 * 0.5; // 4:59 in seconds
            const display = document.querySelector('#timer');
            startTimer(fiveMinutes, display);
        };
        
        // Form submission
        form.addEventListener('submit', (e) => {
            updateHiddenInput();
            
            if (hiddenInput.value.length !== 6) {
                e.preventDefault();
                alert('Please enter a valid 6-digit code');
                inputs[0].focus();
            }
        });
        
        // Resend code functionality
        document.getElementById('resend-link').addEventListener('click', function() {
            alert('A new verification code has been sent to your authenticator app.');
            
            // Reset timer
            const fiveMinutes = 60 * 5 - 1;
            const display = document.querySelector('#timer');
            startTimer(fiveMinutes, display);
            
            // Clear inputs
            inputs.forEach(input => {
                input.value = '';
            });
            inputs[0].focus();
        });
    </script>
</body>
</html>
