<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Organizations</title>

    <!-- Bootstrap 5.3 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- DataTables -->
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.4/css/jquery.dataTables.min.css" />

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
     <link rel="stylesheet" th:href="@{/css/styles.css}">

    <style>
        body {
            font-family: "Public Sans", sans-serif;
            background-color: #f8f9fa;
            color: #212529;
        }

        .main-content {
            margin-left: 280px;
            padding: 2rem;
            background-color: #f8f9fa;
        }

        .table-container {
            background-color: #ffffff;
            border-radius: 12px;
            padding: 2rem;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            border: 1px solid #dee2e6;
        }

        h2 {
            color: #212529;
            font-weight: 600;
            margin-bottom: 1.5rem;
        }

        .table {
            color: #212529;
            font-size: 0.95rem;
        }

        .table thead th {
            background-color: #f1f5f9;
            color: #495057;
            font-weight: 600;
            border-bottom: 2px solid #dee2e6;
        }

        .table tbody tr:hover {
            background-color: #f8f9fa;
        }

        .btn-success {
            background-color: #198754;
            border-color: #198754;
            font-weight: 500;
            color: #fff;
        }

        .btn-warning {
            background-color: #ffc107;
            border-color: #ffc107;
            color: #212529;
            font-weight: 500;
        }

        .btn-danger {
            background-color: #dc3545;
            border-color: #dc3545;
            color: #fff;
            font-weight: 500;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .action-buttons {
            white-space: nowrap;
        }

        .btn-icon {
            margin-right: 5px;
        }

        div.dataTables_filter {
            display: none; /* Hide default search box */
        }

        .dataTables_wrapper .dataTables_length select {
  width: auto;
  display: inline-block;
  margin-left: 0.5rem;
  margin-right: 1rem;
  padding: 0.3rem 0.75rem;
  border-radius: 0.375rem;
  border: 1px solid #ced4da;
}

.dataTables_wrapper .dataTables_paginate .paginate_button {
  padding: 0.3rem 0.75rem;
  margin: 0 2px;
  border: 1px solid #dee2e6;
  background-color: #f8f9fa;
  color: #212529;
  border-radius: 0.375rem;
}

.dataTables_wrapper .dataTables_paginate .paginate_button.current {
  background-color: #0d6efd;
  color: #fff !important;
  border: 1px solid #0d6efd;
}

.dataTables_wrapper .dataTables_paginate .paginate_button:hover {
  background-color: #e2e6ea;
  color: #000 !important;
}

    </style>
</head>

<body>

<div th:replace="fragments/sidebar :: sidebar"></div>

<main class="main-content content-expanded">
    <div class="table-container">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Employee List</h2>
            <a href="/employees/new" class="btn btn-success">Add New Employee</a>
        </div>

        <!-- Custom Search Input -->
        <input type="text" id="customSearch" class="form-control mb-3" placeholder="Search employees...">

        <div class="table-responsive">
            <table class="table table-bordered table-hover align-middle" id="employee-table">
                <thead class="table-light">
                    <tr>
                        <th>EMP Code</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Department</th>
                        <th>Team</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="employeeTableBody">
                    <tr th:each="emp : ${employees}" class="employee-row">
                        <td th:text="${emp.employeeCode}"></td>
                        <td th:text="${emp.name}"></td>
                        <td th:text="${emp.email}"></td>
                        <td th:text="${emp.departmentName}"></td>
                        <td th:text="${emp.teamName}"></td>
                        <td th:text="${emp.status}"></td>
                        <td>
                            <a th:href="@{'/employees/edit/' + ${emp.id}}" class="btn btn-warning btn-sm">Edit</a>
                            <a th:href="@{'/employees/delete/' + ${emp.id}}" onclick="return confirm('Delete this employee?');" class="btn btn-danger btn-sm">Delete</a>
                            <input type="hidden" class="employee-data"
                                   th:value="${emp.name + '|' + emp.email + '|' + emp.employeeCode + '|' +
                                     emp.phone + '|' + emp.alternativePhone + '|' + emp.alternativePhoneRelation + '|' +
                                     emp.relationType + '|' + emp.address + '|' + emp.currentAddress + '|' +
                                     emp.bloodGroup + '|' + #dates.format(emp.dateOfBirth, 'dd-MM-yyyy') + '|' +
                                     #dates.format(emp.joiningDate, 'dd-MM-yyyy') + '|' +
                                     emp.departmentName + '|' + emp.teamName + '|' + emp.status}"/>
                            <button type="button" class="btn btn-info btn-sm view-more-btn" data-bs-toggle="modal" data-bs-target="#viewMoreModal">
                                View More
                            </button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<!-- Modal -->
<div class="modal" id="viewMoreModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-lg modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Employee Details</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <table class="table table-bordered">
          <tbody>
            <tr><th>Name</th><td id="empName"></td></tr>
            <tr><th>Email</th><td id="empEmail"></td></tr>
            <tr><th>Employee Code</th><td id="empCode"></td></tr>
            <tr><th>Phone</th><td id="empPhone"></td></tr>
            <tr><th>Alternative Phone</th><td id="empAltPhone"></td></tr>
            <tr><th>Relation</th><td id="empAltRelation"></td></tr>
            <tr><th>Relation Type</th><td id="empRelationType"></td></tr>
            <tr><th>Permanent Address</th><td id="empAddress"></td></tr>
            <tr><th>Current Address</th><td id="empCurrentAddress"></td></tr>
            <tr><th>Blood Group</th><td id="empBloodGroup"></td></tr>
            <tr><th>Date of Birth</th><td id="empDob"></td></tr>
            <tr><th>Joining Date</th><td id="empJoinDate"></td></tr>
            <tr><th>Department</th><td id="empDepartment"></td></tr>
            <tr><th>Team</th><td id="empTeam"></td></tr>
            <tr><th>Status</th><td id="empStatus"></td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<!-- Scripts -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.datatables.net/1.13.4/js/jquery.dataTables.min.js"></script>

<script>
  // Initialize DataTable
  $(document).ready(function () {
    const dataTable = $('#employee-table').DataTable({
  scrollX: true,
  pageLength: 10,
  lengthChange: true,
  searching: true,
  ordering: true,
  autoWidth: false,
  language: {
    lengthMenu: "Show _MENU_ entries",
    paginate: {
      previous: "« Previous",
      next: "Next »"
    },
    search: ""
  },
  dom: '<"d-flex justify-content-between align-items-center mb-2"lf>tip'
});


    // Custom search input
    $('#customSearch').on('keyup', function () {
      dataTable.search(this.value).draw();
    });

    // View More modal logic
    $('.view-more-btn').on('click', function () {
      const hiddenInput = $(this).closest('tr').find('.employee-data').val();
      const values = hiddenInput.split('|');

      const keys = [
        'empName', 'empEmail', 'empCode', 'empPhone', 'empAltPhone',
        'empAltRelation', 'empRelationType', 'empAddress', 'empCurrentAddress',
        'empBloodGroup', 'empDob', 'empJoinDate', 'empDepartment',
        'empTeam', 'empStatus'
      ];

      keys.forEach((id, i) => {
        $('#' + id).text(values[i] || '');
      });
    });
  });
</script>

</body>
</html>
