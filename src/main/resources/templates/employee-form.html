<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Add Employee</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}">

    <style>
        body {
            font-family: "Public Sans", sans-serif;
            background-color: #f8f9fa;
            color: #212529;
        }

        .container {
            background-color: #ffffff;
            border-radius: 10px;
            padding: 3rem;
            margin: 4rem auto;
            max-width: 1000px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
            margin-left: 350px;
        }

        h2 {
            color: #1f2937;
            margin-bottom: 2rem;
            font-weight: 600;
            font-size: 1.8rem;
        }

        .form-label {
            color: #0d6efd;
            font-weight: 500;
            font-size: 0.95rem;
        }

        .form-control,
        .form-select {
            background-color: #f9fafb;
            border: 1px solid #ced4da;
            border-radius: 6px;
            color: #212529;
            padding: 0.65rem 0.75rem;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
            font-size: 0.95rem;
        }

        .form-control:focus,
        .form-select:focus {
            background-color: #ffffff;
            border-color: #0d6efd;
            box-shadow: 0 0 0 3px rgba(13, 110, 253, 0.15);
        }

        .btn-primary {
            background-color: #0d6efd;
            border: none;
            padding: 0.6rem 1.5rem;
            font-weight: 600;
            border-radius: 6px;
            font-size: 1rem;
        }

        .btn-primary:hover {
            background-color: #0b5ed7;
        }

        .btn-secondary {
            background-color: #6c757d;
            border: none;
            padding: 0.6rem 1.5rem;
            font-weight: 500;
            border-radius: 6px;
            color: white;
            font-size: 1rem;
        }

        .btn-secondary:hover {
            background-color: #5a6268;
        }
    </style>
</head>

<body>
<div th:replace="fragments/sidebar :: sidebar"></div>

<main id="mainContent" class="content-expanded p-4">
    <div class="container">
        <h2 th:text="${employee.id == null} ? 'Add Employee' : 'Edit Employee'"></h2>
        <form th:action="@{/employees/save}" th:object="${employee}" method="post">
            <input type="hidden" th:field="*{id}" />

            <div class="row">
                <div class="col-md-4 mb-3">
                    <label class="form-label">Name</label>
                    <input type="text" th:field="*{name}" class="form-control" required />
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" th:field="*{email}" class="form-control" required />
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label">Phone</label>
                    <input type="text" th:field="*{phone}" class="form-control" />
                </div>
            </div>

            <div class="row">
                <div class="col-md-4 mb-3">
                    <label class="form-label">Password</label>
                    <input type="password" th:field="*{password}" class="form-control" />
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label">Employee Code</label>
                    <input type="text" th:field="*{employeeCode}" class="form-control" required />
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label">Designation</label>
                    <input type="text" th:field="*{designation}" class="form-control" required />
                </div>
            </div>

            <div class="row">
                <div class="col-md-4 mb-3">
                    <label class="form-label">Joining Date</label>
                    <input type="date" th:field="*{joiningDate}" class="form-control" required />
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label">Department</label>
                    <select id="departmentSelect" th:field="*{departmentId}" class="form-select" required>
                        <option value="">-- Select Department --</option>
                        <option th:each="d : ${departments}" th:value="${d.id}" th:text="${d.name}"></option>
                    </select>
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label">Team</label>
                    <select id="teamSelect" th:field="*{teamId}" class="form-select" required>
                        <option value="">-- Select Team --</option>
                    </select>
                </div>
            </div>

            <div class="row">
                <div class="col-md-4 mb-3">
                    <label class="form-label">Permanent Address</label>
                    <input type="text" th:field="*{address}" class="form-control" />
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label">Current Address</label>
                    <input type="text" th:field="*{currentAddress}" class="form-control" />
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label">Blood Group</label>
                    <input type="text" th:field="*{bloodGroup}" class="form-control" />
                </div>
            </div>

            <div class="row">
                <div class="col-md-4 mb-3">
                    <label class="form-label">Date of Birth</label>
                    <input type="date" th:field="*{dateOfBirth}" class="form-control" />
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label">Alternative Phone</label>
                    <input type="text" th:field="*{alternativePhone}" class="form-control" />
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label">Alt. Phone Owner</label>
                    <input type="text" th:field="*{alternativePhoneRelation}" class="form-control" placeholder="Relation Name" />
                </div>
            </div>

            <div class="row">
                <div class="col-md-4 mb-3">
                    <label class="form-label">Relation Type</label>
                    <input type="text" th:field="*{relationType}" class="form-control" placeholder="e.g., Father, Spouse" />
                </div>
                <div class="col-md-8 mb-3">
                    <label class="form-label">Status</label>
                    <select th:field="*{status}" class="form-select" required>
                        <option value="Active">Active</option>
                        <option value="Inactive">Inactive</option>
                        <option value="Terminated">Terminated</option>
                    </select>
                </div>
            </div>

            <div class="mt-4">
                <button type="submit" class="btn btn-primary">Save</button>
                <a th:href="@{/employees/list}" class="btn btn-secondary ms-2">Cancel</a>
            </div>
        </form>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        const departmentSelect = document.getElementById('departmentSelect');
        const teamSelect = document.getElementById('teamSelect');

        departmentSelect.addEventListener('change', function () {
            const deptId = this.value;
            teamSelect.innerHTML = '<option value="">-- Select Team --</option>';

            if (deptId) {
                axios.get(`/employees/teams/by-department/${deptId}`)
                    .then(response => {
                        const teams = response.data;
                        teams.forEach(team => {
                            const option = document.createElement('option');
                            option.value = team.id;
                            option.textContent = team.name;
                            teamSelect.appendChild(option);
                        });
                    })
                    .catch(error => {
                        console.error('Error loading teams:', error);
                    });
            }
        });
    });
</script>

</body>
</html>
